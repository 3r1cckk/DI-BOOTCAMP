services:
  - type: web
    name: mtaani-fix
    runtime: node
    plan: starter
    rootDir: mtaani-fix
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: mtaani-fix-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ALLOW_REGISTRATION
        value: "false"
  - type: web
    name: akiba-studio
    runtime: node
    plan: free
    branch: main
    rootDir: WEEK-11/DAY-1/akiba-studio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AKIBA_DATA_DIR
        value: /tmp/akiba-data
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SOZURI_API_KEY
        sync: false
      - key: SOZURI_PROJECT
        sync: false
      - key: SOZURI_API_URL
        value: https://sozuri.net/api/v1/messaging
      - key: SOZURI_FROM
        sync: false
