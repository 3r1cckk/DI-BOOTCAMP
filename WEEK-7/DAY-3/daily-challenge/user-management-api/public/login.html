<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Northstar</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/form.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <section class="visual-panel" aria-label="Northstar account portal">
      <a class="wordmark" href="/">northstar<span>.</span></a>
      <div class="visual-copy">
        <p class="eyebrow">YOUR SPACE, IN FOCUS</p>
        <h1>Good to<br>see you again.</h1>
        <p>Pick up where your next idea begins.</p>
      </div>
      <div class="visual-index">MEMBER PORTAL <span>01 / 02</span></div>
    </section>

    <section class="form-panel">
      <div class="form-wrap">
        <p class="eyebrow">MEMBER ACCESS</p>
        <h2>Sign in</h2>
        <p class="form-intro">Enter your details to continue.</p>
        <form data-form="login" novalidate>
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button type="submit" disabled>Sign in <span aria-hidden="true">&#8594;</span></button>
          <p class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="form-switch">New around here? <a href="/register.html">Create an account</a></p>
      </div>
      <footer>ACCOUNT SERVICES <span>SECURE SIGN IN</span></footer>
    </section>
  </main>
</body>
</html>
