<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple calculator for addition, subtraction, multiplication, and division."
    />
    <title>Little Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        font-family:
          Nunito, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #293b43;
        background: #f7f3e9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        font-optical-sizing: auto;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .page {
        display: grid;
        min-height: 100vh;
        padding: 32px 24px;
        place-items: center;
        background-image: radial-gradient(#d7ddcf 0.7px, transparent 0.7px);
        background-position: -4px -4px;
        background-size: 24px 24px;
      }

      .calculator {
        width: min(100%, 480px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid #ebe4d5;
        border-radius: 24px;
        background: #fffdf8;
        box-shadow: 0 16px 42px rgb(79 72 49 / 10%);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #bd674c;
        font-family: Caveat, cursive;
        font-size: 1.42rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        color: #293b43;
        font-family: Caveat, cursive;
        font-size: clamp(3rem, 9vw, 4rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1;
      }

      .intro {
        margin: 13px 0 30px;
        color: #718087;
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .calculator-form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        color: #4f6268;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 50px;
        padding: 0 14px;
        border: 1px solid #e3e2d9;
        border-radius: 11px;
        outline: none;
        background: #fffefa;
        color: #293b43;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .field input:focus,
      .field select:focus {
        border-color: #6c9e92;
        box-shadow: 0 0 0 3px rgb(108 158 146 / 15%);
      }

      .add-button {
        min-height: 52px;
        margin-top: 3px;
        border: 0;
        border-radius: 11px;
        background: #39796f;
        color: #fff;
        cursor: pointer;
        font-weight: 800;
        transition:
          background-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .add-button:hover {
        background: #30695f;
        box-shadow: 0 7px 16px rgb(57 121 111 / 20%);
        transform: translateY(-1px);
      }

      .add-button:active {
        transform: translateY(0);
      }

      .add-button:focus-visible {
        outline: 3px solid #293b43;
        outline-offset: 3px;
      }

      .result {
        margin-top: 24px;
        padding: 19px;
        border: 1px solid #dce8db;
        border-radius: 14px;
        background: #f2f7ed;
      }

      .result-label {
        margin: 0 0 7px;
        color: #55746c;
        font-size: 0.8rem;
        font-weight: 800;
      }

      .result-equation {
        margin: 0 0 3px;
        color: #74847d;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }

      .result-value {
        margin: 0;
        color: #285e52;
        font-size: clamp(1.7rem, 7vw, 2.4rem);
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        letter-spacing: -0.055em;
        overflow-wrap: anywhere;
      }

      .error {
        margin: 16px 0 0;
        color: #a3443b;
        font-size: 0.87rem;
        line-height: 1.5;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const operations = {
        add: {
          label: "Add (+)",
          symbol: "+",
          calculate: (first, second) => first + second,
        },
        subtract: {
          label: "Take away (−)",
          symbol: "−",
          calculate: (first, second) => first - second,
        },
        multiply: {
          label: "Multiply (×)",
          symbol: "×",
          calculate: (first, second) => first * second,
        },
        divide: {
          label: "Divide (÷)",
          symbol: "÷",
          calculate: (first, second) => first / second,
        },
      };

      function Calculator() {
        const [firstNumber, setFirstNumber] = React.useState("");
        const [secondNumber, setSecondNumber] = React.useState("");
        const [operation, setOperation] = React.useState("add");
        const [result, setResult] = React.useState(null);
        const [error, setError] = React.useState("");

        function handleSubmit(event) {
          event.preventDefault();
          setError("");
          setResult(null);

          if (!firstNumber.trim() || !secondNumber.trim()) {
            setError("Pop a number in both boxes and give it another try.");
            return;
          }

          const first = Number(firstNumber);
          const second = Number(secondNumber);

          if (!Number.isFinite(first) || !Number.isFinite(second)) {
            setError("Those don't look like numbers yet. Check both boxes and try again.");
            return;
          }

          if (operation === "divide" && second === 0) {
            setError("We can't divide by zero. Try a different second number.");
            return;
          }

          const answer = operations[operation].calculate(first, second);

          if (!Number.isFinite(answer)) {
            setError("That answer is a bit too big to show. Try smaller numbers.");
            return;
          }

          setResult({
            first,
            second,
            operation,
            answer,
          });
        }

        return (
          <main className="page">
            <section className="calculator" aria-labelledby="calculator-title">
              <p className="eyebrow">Your friendly little number helper</p>
              <h1 id="calculator-title">Let’s work it out.</h1>
              <p className="intro">
                Choose what to do, pop in two numbers, and I’ll do the maths
                for you.
              </p>

              <form className="calculator-form" onSubmit={handleSubmit}>
                <div className="field">
                  <label htmlFor="first-number">Your first number</label>
                  <input
                    id="first-number"
                    type="number"
                    step="any"
                    inputMode="decimal"
                    value={firstNumber}
                    onChange={(event) => setFirstNumber(event.target.value)}
                    placeholder="Try 12"
                    required
                  />
                </div>

                <div className="field">
                  <label htmlFor="operation">What shall we do?</label>
                  <select
                    id="operation"
                    value={operation}
                    onChange={(event) => setOperation(event.target.value)}
                  >
                    {Object.entries(operations).map(([value, item]) => (
                      <option key={value} value={value}>
                        {item.label}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="field">
                  <label htmlFor="second-number">Your second number</label>
                  <input
                    id="second-number"
                    type="number"
                    step="any"
                    inputMode="decimal"
                    value={secondNumber}
                    onChange={(event) => setSecondNumber(event.target.value)}
                    placeholder="Try 8"
                    required
                  />
                </div>

                <button className="add-button" type="submit">
                  {operation === "add" ? "Add them up" : "Work it out"}
                </button>
              </form>

              {error && (
                <p className="error" role="alert">
                  {error}
                </p>
              )}

              {result !== null && (
                <section className="result" aria-live="polite">
                  <p className="result-label">And the answer is…</p>
                  <p className="result-equation" aria-hidden="true">
                    {result.first} {operations[result.operation].symbol}{" "}
                    {result.second} =
                  </p>
                  <p className="result-value">
                    <span className="sr-only">
                      {result.first} {operations[result.operation].label}{" "}
                      {result.second} equals{" "}
                    </span>
                    {result.answer.toLocaleString(undefined, {
                      maximumFractionDigits: 10,
                    })}
                  </p>
                </section>
              )}
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <Calculator />,
      );
    </script>
  </body>
</html>
