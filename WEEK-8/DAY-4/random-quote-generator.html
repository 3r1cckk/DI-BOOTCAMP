<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little inspiration, one random quote at a time."
    />
    <title>Words to Keep</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #20242b;
        background: #f3f1ec;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      #root {
        min-height: 100vh;
      }

      button {
        font: inherit;
      }

      .page {
        position: relative;
        isolation: isolate;
        display: grid;
        overflow: hidden;
        min-height: 100vh;
        padding: 32px 20px;
        place-items: center;
        transition: background-color 350ms ease;
      }

      .letter-rain {
        position: absolute;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
      }

      .rain-letter {
        position: absolute;
        top: -10vh;
        color: #20242b;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-weight: 700;
        opacity: 0;
        animation: letter-fall linear infinite;
        animation-delay: var(--delay);
        animation-duration: var(--duration);
      }

      @keyframes letter-fall {
        0% {
          opacity: 0;
          transform: translate3d(0, -5vh, 0) rotate(-8deg);
        }

        12%,
        82% {
          opacity: var(--opacity);
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--drift), 115vh, 0) rotate(12deg);
        }
      }

      .quote-card {
        z-index: 1;
        width: min(100%, 680px);
        padding: clamp(30px, 7vw, 68px);
        border: 1px solid rgb(32 36 43 / 10%);
        border-radius: 28px;
        background: transparent;
        box-shadow: 0 24px 70px rgb(32 36 43 / 8%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 30px;
        color: #73777e;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .quote-mark {
        display: block;
        height: 54px;
        font-family: Georgia, serif;
        font-size: 5rem;
        line-height: 1;
        opacity: 0.22;
      }

      .quote {
        margin: 4px 0 24px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 5vw, 3.1rem);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.2;
        transition: color 350ms ease;
      }

      .quote-visual {
        white-space: pre-wrap;
      }

      .quote-character {
        animation: write-character 160ms ease-out both;
        animation-delay: var(--write-delay);
      }

      @keyframes write-character {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .screen-reader-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .author {
        margin: 0 0 38px;
        color: #73777e;
        font-size: 0.95rem;
      }

      .author::before {
        content: "— ";
      }

      .new-quote {
        min-height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 700;
        transition:
          background-color 350ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .new-quote:hover {
        box-shadow: 0 8px 20px rgb(32 36 43 / 18%);
        transform: translateY(-2px);
      }

      .new-quote:active {
        transform: translateY(0);
      }

      .new-quote:focus-visible {
        outline: 3px solid #20242b;
        outline-offset: 4px;
      }

      .hint {
        margin: 20px 0 0;
        color: #92959a;
        font-size: 0.75rem;
      }

      .talking-face {
        display: flex;
        width: 62px;
        height: 68px;
        margin: 24px auto 0;
        align-items: center;
        justify-content: flex-end;
        flex-direction: column;
      }

      .face-head {
        position: relative;
        width: 40px;
        height: 48px;
        border: 1px solid rgb(32 36 43 / 18%);
        border-radius: 48% 48% 45% 45%;
        background: #d99b73;
      }

      .face-hair {
        position: absolute;
        z-index: 1;
        top: -3px;
        left: -2px;
        width: 42px;
        height: 18px;
        border-radius: 60% 60% 28% 28%;
        background: #34251f;
      }

      .face-ear {
        position: absolute;
        top: 20px;
        width: 6px;
        height: 11px;
        border: 1px solid rgb(32 36 43 / 15%);
        border-radius: 50%;
        background: #d99b73;
      }

      .face-ear.left {
        left: -5px;
      }

      .face-ear.right {
        right: -5px;
      }

      .face-eyes {
        position: absolute;
        top: 23px;
        left: 9px;
        display: flex;
        gap: 12px;
      }

      .face-eyes span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #30231e;
      }

      .face-nose {
        position: absolute;
        top: 27px;
        left: 19px;
        width: 3px;
        height: 6px;
        border-right: 1px solid rgb(92 51 37 / 65%);
        border-bottom: 1px solid rgb(92 51 37 / 65%);
        border-radius: 0 0 3px;
      }

      .face-mouth {
        position: absolute;
        top: 35px;
        left: 14px;
        width: 10px;
        height: 3px;
        border: 1px solid #743a34;
        border-radius: 2px 2px 6px 6px;
        background: #8b4037;
        animation: face-talk var(--talk-duration) ease-in-out both;
      }

      @keyframes face-talk {
        0%,
        100% {
          height: 3px;
        }

        12%,
        32%,
        52%,
        72%,
        92% {
          height: 9px;
        }

        22%,
        42%,
        62%,
        82% {
          height: 4px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .rain-letter {
          display: none;
          animation: none;
        }

        .quote-character {
          animation: none;
        }

        .face-mouth {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const quotes = [
        {
          text: "A small step still changes where you stand.",
          author: "Anonymous",
        },
        {
          text: "You do not have to see the whole path to take the next step.",
          author: "Anonymous",
        },
        {
          text: "Make something good with the day you have.",
          author: "Anonymous",
        },
        {
          text: "Progress is often quiet before it becomes visible.",
          author: "Anonymous",
        },
        {
          text: "Begin where you are; let curiosity lead the rest.",
          author: "Anonymous",
        },
        {
          text: "A little patience can make room for a better answer.",
          author: "Anonymous",
        },
        {
          text: "Keep the promise you made to your future self.",
          author: "Anonymous",
        },
        {
          text: "There is courage in trying again with what you know now.",
          author: "Anonymous",
        },
        {
          text: "Give your attention to what you want to grow.",
          author: "Anonymous",
        },
        {
          text: "You can move forward without having everything figured out.",
          author: "Anonymous",
        },
        {
          text: "Leave a little space for the unexpected to be wonderful.",
          author: "Anonymous",
        },
        {
          text: "The work you do today is a kindness to tomorrow.",
          author: "Anonymous",
        },
      ];

      const palettes = [
        { background: "#e9f1ec", quote: "#285c4d", button: "#285c4d" },
        { background: "#f8e8df", quote: "#994b34", button: "#994b34" },
        { background: "#ece9f7", quote: "#5e4b8b", button: "#5e4b8b" },
        { background: "#f6efda", quote: "#816522", button: "#816522" },
        { background: "#e4eef5", quote: "#35617e", button: "#35617e" },
        { background: "#f1e7ee", quote: "#844d6e", button: "#844d6e" },
      ];

      const rainLetters = Array.from({ length: 46 }, (_, index) => {
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

        return {
          id: index,
          character:
            characters[Math.floor(Math.random() * characters.length)],
          left: `${Math.random() * 100}%`,
          delay: `${-Math.random() * 24}s`,
          duration: `${16 + Math.random() * 16}s`,
          drift: `${Math.random() * 100 - 50}px`,
          opacity: 0.12 + Math.random() * 0.2,
          size: `${12 + Math.random() * 12}px`,
        };
      });

      function randomIndex(length, excludedIndex) {
        const availableIndices = Array.from(
          { length },
          (_, index) => index,
        ).filter((index) => index !== excludedIndex);

        return availableIndices[
          Math.floor(Math.random() * availableIndices.length)
        ];
      }

      function App() {
        const [quoteIndex, setQuoteIndex] = React.useState(() =>
          Math.floor(Math.random() * quotes.length),
        );
        const [paletteIndex, setPaletteIndex] = React.useState(() =>
          Math.floor(Math.random() * palettes.length),
        );
        const quote = quotes[quoteIndex];
        const palette = palettes[paletteIndex];

        function showAnotherQuote() {
          setQuoteIndex((currentIndex) =>
            randomIndex(quotes.length, currentIndex),
          );
          setPaletteIndex((currentIndex) =>
            randomIndex(palettes.length, currentIndex),
          );
        }

        return (
          <main
            className="page"
            style={{ backgroundColor: palette.background }}
          >
            <div className="letter-rain" aria-hidden="true">
              {rainLetters.map((letter) => (
                <span
                  className="rain-letter"
                  key={letter.id}
                  style={{
                    left: letter.left,
                    "--delay": letter.delay,
                    "--duration": letter.duration,
                    "--drift": letter.drift,
                    "--opacity": letter.opacity,
                    fontSize: letter.size,
                  }}
                >
                  {letter.character}
                </span>
              ))}
            </div>
            <section className="quote-card" aria-labelledby="page-title">
              <p className="eyebrow" id="page-title">
                A moment of inspiration
              </p>
              <span className="quote-mark" aria-hidden="true">
                “
              </span>
              <blockquote
                className="quote"
                style={{ color: palette.quote }}
                aria-live="polite"
                aria-atomic="true"
              >
                <span className="quote-visual" aria-hidden="true" key={quoteIndex}>
                  {Array.from(quote.text, (character, index) => (
                    <span
                      className="quote-character"
                      key={index}
                      style={{
                        "--write-delay": `${(quote.text.length - index - 1) * 0.025}s`,
                      }}
                    >
                      {character}
                    </span>
                  ))}
                </span>
                <span className="screen-reader-only">{quote.text}</span>
              </blockquote>
              <p className="author">{quote.author}</p>
              <button
                className="new-quote"
                style={{ backgroundColor: palette.button }}
                onClick={showAnotherQuote}
                type="button"
              >
                Find another quote
              </button>
              <p className="hint">A new thought, a new color.</p>
              <div
                className="talking-face"
                key={`face-${quoteIndex}`}
                style={{
                  "--talk-duration": `${quote.text.length * 0.025 + 0.16}s`,
                }}
                aria-hidden="true"
              >
                <span className="face-head">
                  <span className="face-hair" />
                  <span className="face-ear left" />
                  <span className="face-ear right" />
                  <span className="face-eyes">
                    <span />
                    <span />
                  </span>
                  <span className="face-nose" />
                  <span className="face-mouth" />
                </span>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
