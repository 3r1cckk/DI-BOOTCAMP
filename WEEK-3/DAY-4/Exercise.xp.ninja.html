<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merge Words</title>
    <style>
        :root { color: #18212f; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { background: #edf3f0; margin: 0; padding: 1rem; }
        main { background: #fffdf8; border-top: 8px solid #e66a4e; box-shadow: 10px 10px 0 #b8d8d0; margin: 2rem auto; max-width: 42rem; padding: 2rem; }
        h1 { font-family: Georgia, serif; font-size: 2.8rem; margin-top: 0; }
        p { border-bottom: 1px solid #d5dfdc; line-height: 1.6; padding: 1rem 0; }
        strong { display: block; margin-bottom: .4rem; }
    </style>
</head>
<body>
    <main>
        <h1>Merge Words</h1>
        <p><strong>mergeWords("Hello")()</strong><span id="hello-result"></span></p>
        <p><strong>mergeWords("There")("is")("no")("spoon.")()</strong><span id="sentence-result"></span></p>
    </main>
    <script src="Exercise.xp.ninja.js"></script>
</body>
</html>
