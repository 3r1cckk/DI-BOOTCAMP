<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Auth</title>
    <style>
        :root { color: #18212f; font-family: Georgia, "Times New Roman", serif; }
        * { box-sizing: border-box; }
        body { align-items: center; background: #e9f2ef; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 2rem 1rem; }
        .auth-card { background: #fffdf8; border-top: 8px solid #e66a4e; box-shadow: 12px 12px 0 #b8d8d0; max-width: 31rem; padding: clamp(2rem, 7vw, 4rem); width: 100%; }
        .brand { color: #e66a4e; font-family: Arial, sans-serif; font-size: .8rem; font-weight: bold; letter-spacing: .12em; margin: 0 0 3rem; text-transform: uppercase; }
        h1 { font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: .95; margin: 0 0 .75rem; }
        .prompt { color: #64716f; font-family: Arial, sans-serif; margin: 0 0 2rem; }
        label { display: block; font-family: Arial, sans-serif; font-size: .8rem; font-weight: bold; margin: 1rem 0 .4rem; }
        input { border: 0; border-bottom: 2px solid #c9d4d1; background: transparent; font: 1rem Arial, sans-serif; outline: 0; padding: .7rem 0; width: 100%; }
        input:focus { border-color: #e66a4e; }
        form button { background: #18212f; border: 0; color: white; cursor: pointer; font: bold .9rem Arial, sans-serif; margin-top: 2rem; padding: 1rem 1.25rem; width: 100%; }
        .message { color: #64716f; font: .85rem Arial, sans-serif; min-height: 1.3rem; }
        .success { color: #27805d; }
        .switch-text { color: #64716f; font: .85rem Arial, sans-serif; margin: 2rem 0 0; text-align: center; }
        .link-button { background: none; border: 0; color: #e66a4e; cursor: pointer; font: inherit; font-weight: bold; padding: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="Mini-Project-Create-a-Sign-in-form.js"></script>
</body>
</html>
