<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tip, Email, and Geolocation</title>
    <style>
        body { font-family: sans-serif; line-height: 1.5; margin: 2rem auto; max-width: 50rem; padding: 0 1rem; }
        section { border-top: 1px solid #ccc; margin-top: 2rem; padding-top: 1rem; }
        label, input, select { display: block; margin: .4rem 0; }
        button { margin-top: .5rem; }
        #totalTip { display: none; }
        #location-output { white-space: pre-line; }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Calculate the tip</h1>
            <form id="tip-form">
                <label for="billAmt">Bill amount</label>
                <input type="number" id="billAmt" min="0" step="0.01" required>
                <label for="serviceQual">Service quality</label>
                <select id="serviceQual">
                    <option value="0">Choose service quality</option>
                    <option value="0.1">10% - Good</option>
                    <option value="0.15">15% - Great</option>
                    <option value="0.2">20% - Excellent</option>
                </select>
                <label for="numOfPeople">Number of people</label>
                <input type="number" id="numOfPeople" min="1" step="1">
                <button type="button" id="calculate">Calculate</button>
            </form>
            <p id="totalTip">Tip per person: <span id="tip"></span> <span id="each">each</span></p>
        </section>

        <section>
            <h1>Validate the email</h1>
            <form id="email-form" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <button type="submit">Validate</button>
            </form>
            <p id="email-message"></p>
        </section>

        <section>
            <h1>Get your location</h1>
            <button type="button" id="location-button">Get coordinates</button>
            <p id="location-output"></p>
        </section>
    </main>
    <script src="Exercise-xp-ninja.js"></script>
</body>
</html>
