<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
            body {
                background-color: black;
                padding: 10px;
            }
            .planet {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                text-align: center;
                padding: 10px;
                position: relative;
                border: 2px solid white;
                margin: 20px;
                display: inline-block;
                color: white;
                font-weight: bold;
                font-size: 12px;
            }
            
            /* Planet Colors */
            .mercury {
                background-color: #8c7853;
            }
            
            .venus {
                background-color: #ffc649;
            }
            
            .earth {
                background-color: #4a90e2;
            }
            
            .mars {
                background-color: #e27b58;
            }
            
            .jupiter {
                background-color: #c88b3a;
            }
            
            .saturn {
                background-color: #fad5a5;
            }
            
            .uranus {
                background-color: #4fd0e7;
            }
            
            .neptune {
                background-color: #4169e1;
            }
            
            .moon {
                position: absolute;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: rgb(237, 237, 237);
                border: 5px solid red;
            }
        </style>
    </head>
    <body>
        <h1 style="color: white; text-align: center;">Solar System</h1>
        <section class="listPlanets"></section>

        <script src="DAILY-CHALLENGE-PLANETS.JS"></script>
    </body>
</html>
