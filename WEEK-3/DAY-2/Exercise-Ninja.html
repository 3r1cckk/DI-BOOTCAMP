<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6 - Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Calendar for September 2012</h1>
    <!-- Calendar will be generated by JavaScript -->

    <script>
        function createCalendar(year, month) {
            // Create a table element
            const table = document.createElement('table');
            table.style.borderCollapse = 'collapse';
            table.style.marginTop = '20px';
            
            // Create header row with day names
            const headerRow = document.createElement('tr');
            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            
            for (let i = 0; i < dayNames.length; i++) {
                const th = document.createElement('th');
                th.textContent = dayNames[i];
                th.style.border = '1px solid black';
                th.style.padding = '5px 10px';
                th.style.backgroundColor = '#e0e0e0';
                headerRow.appendChild(th);
            }
            table.appendChild(headerRow);
            
            // Get the first day of the month
            const date = new Date(year, month - 1, 1);
            const firstDay = date.getDay(); // 0 = Sunday, 1 = Monday, etc.
            
            // Adjust so that Monday is 0
            const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
            
            // Get the number of days in the month
            const daysInMonth = new Date(year, month, 0).getDate();
            
            // Create rows for the calendar
            let dayCounter = 1;
            let currentRow = document.createElement('tr');
            
            // Add empty cells before the first day of the month
            for (let i = 0; i < adjustedFirstDay; i++) {
                const td = document.createElement('td');
                td.style.border = '1px solid black';
                td.style.padding = '5px 10px';
                td.style.width = '40px';
                td.style.height = '40px';
                td.style.textAlign = 'center';
                currentRow.appendChild(td);
            }
            
            // Add days of the month
            for (let i = adjustedFirstDay; i < 7 && dayCounter <= daysInMonth; i++) {
                const td = document.createElement('td');
                td.textContent = dayCounter;
                td.style.border = '1px solid black';
                td.style.padding = '5px 10px';
                td.style.width = '40px';
                td.style.height = '40px';
                td.style.textAlign = 'center';
                currentRow.appendChild(td);
                dayCounter++;
            }
            table.appendChild(currentRow);
            
            // Continue adding weeks
            while (dayCounter <= daysInMonth) {
                currentRow = document.createElement('tr');
                for (let i = 0; i < 7 && dayCounter <= daysInMonth; i++) {
                    const td = document.createElement('td');
                    td.textContent = dayCounter;
                    td.style.border = '1px solid black';
                    td.style.padding = '5px 10px';
                    td.style.width = '40px';
                    td.style.height = '40px';
                    td.style.textAlign = 'center';
                    currentRow.appendChild(td);
                    dayCounter++;
                }
                table.appendChild(currentRow);
            }
            
            // Append the table to the body
            document.body.appendChild(table);
            
            return table;
        }

        // Create the calendar for September 2012
        createCalendar(2012, 9);
    </script>
</body>
</html>
