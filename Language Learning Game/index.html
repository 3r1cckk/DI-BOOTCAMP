                  ["Words learned", profile.wordsLearned, "words", "Ready when you are"],
                  ["Speaking match", averagePronunciation ? `${averagePronunciation}%` : "—", "speak", "Approximate word match"],
                ].map(([label, value, icon, foot]) => (
                  <div className="lq-stat" key={label}>
                    <div className="lq-stat-top"><span>{label}</span><Icon name={icon} className="lq-stat-icon" size={18} /></div>
                    <strong className="lq-stat-value">{value}</strong>
                    <span className="lq-stat-foot">{foot}</span>
                  </div>
                ))}
              </div>
              <button className="lq-featured-activity" onClick={() => changeTab("speak")} type="button">
                <span className="lq-featured-icon"><Icon name="speak" size={29} /></span>
                <span className="lq-featured-copy">
                  <span className="lq-featured-kicker">A good place to begin</span>
                  <strong>Speak a phrase, your way</strong>
                  <span>Listen, repeat, and build confidence at your own pace.</span>
                </span>
                <span className="lq-featured-action">Practise <Icon name="arrow" size={18} /></span>
              </button>
              <div className="lq-dashboard-grid">
                <section className="lq-level-card">
                  <span className="lq-level-mark" aria-hidden="true"><Icon name="leaf" size={21} /></span>
                  <div className="lq-card-heading">
                    <h2 className="lq-card-title">Your progress so far</h2>
                    <span className="lq-pill">Level {levelIndex + 1}</span>
                  </div>
                  <p className="lq-muted">{levelNames[levelIndex]} · You're making progress at your own pace.</p>
                  <div className="lq-progress-track" role="progressbar" aria-label="Progress to next level" aria-valuenow={levelProgress} aria-valuemin="0" aria-valuemax="100">
                    <div className="lq-progress-fill" style={{ width: `${levelProgress}%` }} />
                  </div>
                  <div className="lq-progress-meta"><span>{profile.xp} XP</span><span>{levelIndex === levelNames.length - 1 ? "Top level reached!" : `${Math.max(0, nextLevelXp - profile.xp)} XP to ${levelNames[levelIndex + 1]}`}</span></div>
                </section>
                <section className="lq-card">
                  <div className="lq-card-heading">
                    <h2 className="lq-card-title">A gentle goal for today</h2>
                    <Icon name="spark" size={20} />
                  </div>
                  <p className="lq-muted">{dailyComplete ? "You finished today's goals. Nice work!" : "Try a few small activities today to earn 50 bonus XP. There's no need to do them all at once."}</p>
                  <div className="lq-challenge-list">
                    {tasks.slice(0, 3).map((task) => (
                      <div className="lq-check-row" key={task.id}>
                        <span className={`lq-check-icon${daily.checks[task.id] ? " done" : ""}`}>{daily.checks[task.id] ? "✓" : ""}</span>
                        {task.text}
                      </div>
                    ))}
                  </div>
                  <button className="lq-sidebar-link" style={{ marginTop: 13 }} onClick={() => changeTab("challenges")} type="button">See today's goals →</button>
                </section>
              </div>
              <div className="lq-section-heading"><h2>Choose how to grow</h2><button className="lq-sidebar-link" onClick={() => changeTab("learn")} type="button">Browse all activities <Icon name="arrow" size={15} /></button></div>
              <div className="lq-activity-grid">
                {activityItems.slice(1, 6).map((item) => (
                  <button className="lq-activity" key={item.id} onClick={() => item.id === "speak" ? changeTab("speak") : item.id === "conversation" ? startConversation() : beginGame(item.id)} type="button">
                    <span className="lq-activity-icon" aria-hidden="true"><Icon name={item.icon} size={22} /></span>
                    <span className="lq-activity-title">{item.title}</span>
                    <span className="lq-activity-copy">{item.copy}</span>
                  </button>
                ))}
              </div>
              <div className="lq-section-heading"><h2>Little wins</h2><button className="lq-sidebar-link" onClick={() => changeTab("achievements")} type="button">See all achievements →</button></div>
              <section className="lq-card lq-wins-card">
                {earnedBadges.length
                  ? <div className="lq-earned-list">{earnedBadges.slice(-3).map((badge) => <span className="lq-earned-item" key={badge.id}><Icon name={badge.icon} size={17} />{badge.title}</span>)}</div>
                  : <p className="lq-muted">{recommendations}</p>}
              </section>
            </>
          );
        }

        function renderLearn() {
          if (!gameRound.length) {
            return (
              <>
                <PageHeader kicker="Choose your next step" title="What would you like to practise?" copy={`Pick whatever sounds good. Activities are set to your ${profile.difficulty.toLowerCase()} level.`} />
                <div className="lq-two-col">
                  <section className="lq-practice-card">
                    <h2>Want to practise speaking?</h2>
                    <p>Listen to a phrase, then try saying it. You can use your microphone or type what you said—either way, this is just practice.</p>
                    <button className="lq-primary" onClick={() => changeTab("speak")} type="button">Try a speaking exercise</button>
                  </section>
                  <section className="lq-card">
                    <h2 className="lq-card-title">Not sure where to start?</h2>
                    <p className="lq-muted">{profile.speakingExercises && averagePronunciation < 80 ? "Try a few short phrases at your own pace. Repeating them is part of learning." : "A quick word quiz is an easy way to warm up."}</p>
                    <button className="lq-sidebar-link" onClick={() => beginGame("quiz")} type="button">Start with a word quiz →</button>
                  </section>
                </div>
                <div className="lq-section-heading"><h2>Choose an activity</h2><span className="lq-muted">Go at your own pace</span></div>
                <div className="lq-activity-grid">
                  {activityItems.map((item) => (
                    <button className="lq-activity" key={item.id} onClick={() => item.id === "speak" ? changeTab("speak") : item.id === "conversation" ? startConversation() : beginGame(item.id)} type="button">
                      <span className="lq-activity-icon" aria-hidden="true"><Icon name={item.icon} size={22} /></span>
                      <span className="lq-activity-title">{item.title}</span>
                      <span className="lq-activity-copy">{item.copy}</span>
                    </button>
                  ))}
                </div>
                <div className="lq-section-heading"><h2>Language notes</h2></div>
                <section className="lq-card">
                  <p className="lq-muted"><strong>Beginner</strong> includes pronunciation hints and familiar words. <strong>Intermediate</strong> brings longer phrases and fewer hints. <strong>Advanced</strong> offers more natural sentences and independent practice. You can change your level any time in your profile.</p>
                </section>
              </>
            );
          }

          if (gameDone) {
            return (
              <>
                <PageHeader kicker="That's a round done" title="Thanks for practising." copy="Here's how you did. Every answer—including the tricky ones—helps you learn." />
                <section className="lq-card" style={{ maxWidth: 600 }}>
                  <div className="lq-stat-value">{gameScore} / {gameRound.length}</div>
                  <p className="lq-muted">You earned some XP and made progress on today's goal. If a few answers were tricky, you can always come back to them.</p>
                  <button className="lq-primary" onClick={() => gameMode === "mistakes" ? beginMistakeReview() : beginGame(gameMode)} type="button">Play another round →</button>
                  <button className="lq-secondary" style={{ marginLeft: 8 }} onClick={() => { setGameRound([]); setGameDone(false); }} type="button">Choose another activity</button>
                </section>
              </>
            );
          }

          if (gameMode === "match") {
            return (
              <>
                <PageHeader kicker="Match the words" title="Which words go together?" copy={`${gameScore} of ${gameRound.length} pairs matched. Choose one word from each side.`} action={<button className="lq-secondary" onClick={() => { setGameRound([]); }} type="button">Leave activity</button>} />
                <div className="lq-two-col">
                  <section className="lq-card"><h2 className="lq-card-title">In {language}</h2><div className="lq-challenge-list" style={{ marginTop: 14 }}>{gameRound.map((item) => <button className={`lq-game-card${matchedPairs.includes(item.meaning) ? " correct" : ""}`} style={{ minHeight: 48, justifyContent: "center", background: matchedPairs.includes(item.meaning) ? "#eef7ee" : matchLeft === item.meaning ? "#f2f6e9" : "" }} key={item.word} onClick={() => chooseMatch("left", item.meaning)} disabled={matchedPairs.includes(item.meaning)} type="button">{item.word}</button>)}</div></section>
                  <section className="lq-card"><h2 className="lq-card-title">In English</h2><div className="lq-challenge-list" style={{ marginTop: 14 }}>{matchOptions.map((meaning) => <button className="lq-game-card" style={{ minHeight: 48, justifyContent: "center", background: matchedPairs.includes(meaning) ? "#eef7ee" : matchRight === meaning ? "#f2f6e9" : "" }} key={meaning} onClick={() => chooseMatch("right", meaning)} disabled={matchedPairs.includes(meaning)} type="button">{meaning}</button>)}</div></section>
                </div>
                <p className="lq-muted" role="status">{gameNote || "Pick a word on each side. No rush."}</p>
              </>
            );
          }

          if (gameMode === "flashcards") {
            return (
              <>
                <PageHeader kicker="Flashcards" title="A quick way to review." copy={`Card ${gameIndex + 1} of ${gameRound.length} · Try to remember the meaning before you turn it over.`} />
                <section className="lq-practice-card" style={{ maxWidth: 620, textAlign: "center" }}>
                  <p className="lq-kicker">{language} · {currentQuestion.hint}</p>
                  <h2 className="lq-target-text">{flashRevealed ? currentQuestion.meaning : currentQuestion.word}</h2>
                  {!flashRevealed ? <button className="lq-primary" style={{ marginTop: 19 }} onClick={() => { setFlashRevealed(true); playAudio(currentQuestion.word); }} type="button">Show me the meaning</button> : <div style={{ display: "flex", marginTop: 18, justifyContent: "center", gap: 9 }}><button className="lq-secondary" onClick={() => markFlashcard(false)} type="button">I'll practise this one</button><button className="lq-primary" onClick={() => markFlashcard(true)} type="button">I remembered it ✓</button></div>}
                  <p className="lq-muted" style={{ marginTop: 18 }}>Forgot it? That's okay. Seeing a word again is how it starts to stick.</p>
                </section>
              </>
            );
          }

          const isTextMode = ["fill", "order", "translate"].includes(gameMode);
          const orderTokens = currentQuestion.tokens || [];
          const expectedChoice = currentQuestion.memoryKind === "phrase"
            ? currentQuestion.english
            : currentQuestion.meaning;
          return (
            <>
              <PageHeader kicker={gameMode === "mistakes" ? "A little review, just for you" : `Vocabulary · ${activityItems.find((item) => item.id === gameMode)?.title || "Practice"}`} title={gameMode === "mistakes" ? "Let's revisit this one." : gameMode === "fill" ? "Can you remember the word?" : gameMode === "order" ? "Put the sentence together." : gameMode === "translate" ? "What does this phrase mean?" : "Pick the meaning that fits."} copy={gameMode === "mistakes" ? `Question ${gameIndex + 1} of ${gameRound.length} · These are words and phrases you've wanted to practise again.` : `Question ${gameIndex + 1} of ${gameRound.length} · ${gameScore} correct so far`} action={<button className="lq-secondary" onClick={() => { setGameRound([]); setGameDone(false); }} type="button">Leave activity</button>} />
              <section className="lq-speak-target" style={{ maxWidth: 720, margin: "0 auto" }}>
                {gameMode === "mistakes" ? <>
                  <p className="lq-target-label">{currentQuestion.memoryKind === "phrase" ? "What does this phrase mean?" : "What does this word mean?"}</p>
                  <h2 className="lq-target-text" lang={languageInfo.locale}>{currentQuestion.word || currentQuestion.target}</h2>
                  {currentQuestion.memoryKind === "phrase" && <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(currentQuestion.target)} type="button"><Icon name="audio" size={17} /> Listen</button></div>}
                </> : gameMode === "translate" ? <>
                  <p className="lq-target-label">Translate this into English</p>
                  <h2 className="lq-target-text">{currentQuestion.target}</h2>
                  <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(currentQuestion.target)} type="button"><Icon name="audio" size={17} /> Listen</button></div>
                </> : gameMode === "order" ? <>
                  <p className="lq-target-label">Build this phrase in {language}</p>
                  <h2 className="lq-target-text">{currentQuestion.english}</h2>
                  <div className="lq-word-feedback">{orderTokens.map((token, index) => <button className="lq-word-chip" key={`${token}-${index}`} onClick={() => setSentenceParts((parts) => [...parts, token])} type="button">{token}</button>)}</div>
                  <p className="lq-target-translation">{sentenceParts.join(" ") || "Tap the words in order."}</p>
                </> : <>
                  <p className="lq-target-label">{gameMode === "fill" ? `How do you say “${currentQuestion.meaning}” in ${language}?` : gameMode === "listening" ? "Listen to the word, then choose its meaning." : "What does this word mean in English?"}</p>
                  <h2 className="lq-target-text">{currentQuestion.word}</h2>
                  {profile.difficulty === "Beginner" && <p className="lq-target-translation">Pronunciation hint: {currentQuestion.hint}</p>}
                  <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(currentQuestion.word, profile.difficulty === "Beginner" ? .78 : 1)} type="button"><Icon name="audio" size={17} /> Listen</button></div>
                </>}
              </section>
              {gameMode === "match" ? null : isTextMode ? (
                <form className="lq-card" style={{ maxWidth: 720, margin: "14px auto 0" }} onSubmit={submitTypedGame}>
                  {gameMode !== "order" && <label className="lq-form-field"><span className="lq-form-label">{gameMode === "fill" ? "Your answer" : "Your translation"}</span><input className="lq-input" value={typedAnswer} onChange={(event) => setTypedAnswer(event.target.value)} disabled={Boolean(gameAnswer)} autoComplete="off" placeholder="Type your answer..." /></label>}
                  {gameMode === "order" && <button className="lq-secondary" style={{ marginRight: 8 }} onClick={() => setSentenceParts([])} type="button">Clear words</button>}
                  {!gameAnswer ? <button className="lq-primary" type="submit">Check my answer</button> : <button className="lq-primary" onClick={() => advanceGame(gameScore)} type="button">Next →</button>}
                  {gameNote && <p className="lq-muted" role="status">{gameNote}</p>}
                </form>
              ) : (
                <>
                  <p className="lq-muted" style={{ margin: "17px 0 9px" }}>{gameMode === "mistakes" ? "Take a moment, then choose the answer that makes sense." : "Choose the meaning that feels right."}</p>
                  <div className="lq-game-list">
                    {currentQuestion.choices.map((choice) => <button className="lq-game-card" style={{ minHeight: 55, borderColor: gameAnswer === choice ? (choice === expectedChoice ? "#85b58e" : "#e4a7a0") : undefined, background: gameAnswer === choice ? (choice === expectedChoice ? "#eef7ee" : "#fff1ee") : undefined }} key={choice} onClick={() => selectAnswer(choice)} disabled={Boolean(gameAnswer)} type="button">{choice}</button>)}
                  </div>
                  {gameNote && <p className="lq-muted" role="status">{gameNote}</p>}
                  {gameAnswer && <button className="lq-primary" style={{ marginTop: 13 }} onClick={() => advanceGame(gameScore)} type="button">Next →</button>}
                </>
              )}
            </>
          );
        }

        function renderSpeaking() {
          const tip = speechFeedback?.missing?.length
            ? `Try saying “${speechFeedback.missing[0]}” clearly, then give the full phrase another go.`
            : speechFeedback?.extra?.length
              ? "The transcript includes a few extra words. Try matching the phrase at a comfortable pace."
              : "Nice work. Listening and repeating is a great way to build confidence.";
          return (
            <>
              <PageHeader kicker={`${language} · ${profile.difficulty}`} title="Let's practise saying a phrase." copy="Listen, then say it or type it below. Your browser checks which words it recognises, so the match is only a rough guide—not a pronunciation grade." />
              {storageNotice && <div className="lq-notice" role="status">{storageNotice}</div>}
              <div className="lq-speak-layout">
                <section className="lq-speak-target">
                  <p className="lq-target-label">Try saying</p>
                  <h2 className="lq-target-text" lang={languageInfo.locale}>{currentPhrase.target}</h2>
                  {profile.difficulty === "Beginner" && <p className="lq-target-translation">{currentPhrase.english}</p>}
                  <div className="lq-audio-row">
                    <button className="lq-secondary" onClick={() => playAudio(currentPhrase.target, slowSpeech ? .72 : 1)} type="button"><Icon name="audio" size={17} /> {slowSpeech ? "Slow replay" : "Listen first"}</button>
                    <button className="lq-secondary" onClick={() => setSlowSpeech((value) => !value)} type="button">{slowSpeech ? "Normal speed" : "Slow it down"}</button>
                    {window.speechSynthesis && <button className="lq-secondary" onClick={() => window.speechSynthesis.paused ? window.speechSynthesis.resume() : window.speechSynthesis.pause()} type="button">Pause / resume</button>}
                    <button className="lq-secondary" onClick={() => { setPhraseIndex((index) => (index + 1) % phrases.length); setSpeechFeedback(null); setTranscript(""); }} type="button">Another phrase ↻</button>
                  </div>
                </section>
                <section className="lq-mic-panel">
                  <button className={`lq-mic-button${speechState === "listening" ? " listening" : ""}`} onClick={() => startListening(currentPhrase.target)} type="button" aria-label={speechState === "listening" ? "Stop recording" : "Start speaking"}><Icon name="speak" size={23} /></button>
                  <p className="lq-mic-title">{speechState === "listening" ? "I'm listening…" : speechState === "analyzing" ? "One moment…" : "Tap the microphone when you're ready"}</p>
                  <p className="lq-mic-hint">{speechSupported ? "Your browser may ask to use your microphone. Prefer not to? You can type instead." : "Your browser doesn't offer speech recognition here, but you can still listen and type."}</p>
                  <label className="lq-transcript-label" htmlFor="speak-transcript">Type what you said</label>
                  <textarea id="speak-transcript" className="lq-textarea" value={transcript} onChange={(event) => setTranscript(event.target.value)} placeholder="Your words will show up here…" />
                  <button className="lq-primary" style={{ width: "100%", marginTop: 8 }} onClick={() => analyzeTypedSpeech(currentPhrase.target)} disabled={!transcript.trim() || speechState !== "idle"} type="button">See how it went</button>
                </section>
              </div>
              {speechMessage && <div className="lq-notice" style={{ marginTop: 14 }} role="status">{speechMessage}</div>}
              {speechFeedback && (
                <section className="lq-feedback-card" aria-live="polite">
                  <div className="lq-score-row">
                    <div className="lq-score-circle">{speechFeedback.score}%</div>
                    <div><strong style={{ color: "#3f6746" }}>{speechFeedback.score >= 90 ? "Most of the words came through!" : speechFeedback.score >= 70 ? "A good start—keep going!" : "Thanks for giving it a try!"}</strong><p className="lq-muted" style={{ margin: "4px 0 0" }}>This is only a rough match of the words your browser heard. It isn't a pronunciation grade.</p></div>
                  </div>
                  <p className="lq-muted"><strong>Your attempt:</strong> {speechFeedback.heard || "We couldn't make out any words this time."}</p>
                  <p className="lq-muted"><strong>Phrase to practise:</strong> {speechFeedback.target}</p>
                  <div className="lq-word-feedback">{speechFeedback.matched.map((word, index) => <span className="lq-word-chip" key={`${word}-${index}`}>✓ {word}</span>)}{speechFeedback.missing.map((word, index) => <span className="lq-word-chip missed" key={`miss-${word}-${index}`}>Practice: {word}</span>)}{speechFeedback.extra.map((word, index) => <span className="lq-word-chip missed" key={`extra-${word}-${index}`}>Extra: {word}</span>)}</div>
                  <p className="lq-muted" style={{ marginBottom: 0 }}>{tip}</p>
                  {speechFeedback.missing.length > 0 && <button className="lq-secondary" style={{ marginTop: 12 }} onClick={() => { const word = speechFeedback.missing[0]; setTranscript(""); setSpeechFeedback(null); setSpeechMessage(`Practise this word, then try the phrase again: ${word}`); playAudio(word); }} type="button">Practise a tricky word</button>}
                </section>
              )}
              {!speechSupported && <p className="lq-muted" style={{ marginTop: 12 }}>Speech recognition isn't available in this browser. You can still listen to the phrase and type your attempt.</p>}
            </>
          );
        }

        function renderConversation() {
          if (conversationFinished) {
            return (
              <>
                <PageHeader kicker="Conversation finished" title="You made it through the chat." copy="Nice work sticking with it. You can look back at your replies or try another scene." />
                <section className="lq-card" style={{ maxWidth: 680 }}>
                  <div className="lq-chat">{conversationMessages.map((message, index) => <div className={`lq-chat-bubble${message.from === "you" ? " user" : ""}`} key={`${index}-${message.text}`}><span className="lq-chat-speaker">{message.from === "you" ? profile.name : "Your conversation partner"}</span>{message.text}</div>)}</div>
                  <p className="lq-muted" style={{ marginTop: 17 }}>The word-match is a rough guide from your browser, not a score for your accent or pronunciation.</p>
                  <button className="lq-primary" onClick={startConversation} type="button">Try another conversation</button>
                </section>
              </>
            );
          }
          return (
            <>
              <PageHeader kicker={`${language} · Conversation practice`} title="Have a short conversation." copy="Choose a scene, listen to the other person, and reply in your own words—or use the suggested phrase if you need a hand." />
              <div className="lq-form-field" style={{ maxWidth: 300 }}>
                <label className="lq-form-label" htmlFor="conversation-scenario">Choose a scene</label>
                <select id="conversation-scenario" className="lq-select" value={conversationScenario} onChange={(event) => { setConversationScenario(event.target.value); setConversationTurn(0); setConversationMessages([]); setConversationAnswer(""); }}>
                  {["Introductions", "At a café", "At the market", "Meeting someone"].map((scene) => <option key={scene}>{scene}</option>)}
                </select>
              </div>
              <div className="lq-two-col">
                <section className="lq-card">
                  <h2 className="lq-card-title">Your conversation</h2>
                  <div className="lq-chat" style={{ marginTop: 15 }}>
                    <div className="lq-chat-bubble"><span className="lq-chat-speaker">Your conversation partner</span>{conversationScenario === "Introductions" ? activeTurn.guide : activeTurn.english}<span className="lq-chat-translation">{conversationScenario === "Introductions" ? activeTurn.english : activeTurn.guide}</span></div>
                    {conversationMessages.map((message, index) => <div className={`lq-chat-bubble${message.from === "you" ? " user" : ""}`} key={`${index}-${message.text}`}><span className="lq-chat-speaker">{message.from === "you" ? profile.name : "Your conversation partner"}</span>{message.text}</div>)}
                  </div>
                  <p className="lq-muted" style={{ marginTop: 15 }}>Turn {conversationTurn + 1} of {conversationTurns.length}</p>
                </section>
                <section className="lq-mic-panel">
                  <p className="lq-target-label">Your reply in {language}</p>
                  <h2 className="lq-target-text" lang={languageInfo.locale} style={{ fontSize: "1.55rem" }}>{activeTurn.target}</h2>
                  <p className="lq-target-translation">{activeTurn.translation}</p>
                  <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(activeTurn.target)} type="button"><Icon name="audio" size={17} /> Hear a reply</button></div>
                  <button className={`lq-mic-button${speechState === "listening" ? " listening" : ""}`} style={{ width: 64, height: 64, marginTop: 12, fontSize: "1.45rem" }} onClick={() => startListening(activeTurn.target)} type="button" aria-label="Speak your conversation reply"><Icon name="speak" size={23} /></button>
                  {speechMessage && <p className="lq-muted" role="status">{speechMessage}</p>}
                  <form style={{ width: "100%", marginTop: 4 }} onSubmit={sendConversationReply}>
                    <label className="lq-transcript-label" htmlFor="conversation-reply">Or type your reply</label>
                    <textarea id="conversation-reply" className="lq-textarea" value={conversationAnswer || transcript} onChange={(event) => { setConversationAnswer(event.target.value); setTranscript(""); }} placeholder="Write what you'd say…" />
                    <button className="lq-primary" style={{ width: "100%", marginTop: 8 }} disabled={!(conversationAnswer.trim() || transcript.trim())} type="submit">{conversationTurn + 1 === conversationTurns.length ? "Finish chat" : "Send reply →"}</button>
                  </form>
                </section>
              </div>
            </>
          );
        }

        function renderChallenges() {
          return (
            <>
              <PageHeader kicker="A few ideas for today" title="Your daily goals." copy="Try these four small activities when you have time. Finish all four to earn 50 bonus XP; it's fine to leave some for another day." />
              <section className="lq-card" style={{ maxWidth: 720 }}>
                <div className="lq-card-heading"><h2 className="lq-card-title">{dailyComplete ? "All done for today!" : `${Object.values(daily.checks).filter(Boolean).length} of ${tasks.length} goals complete`}</h2><span className="lq-pill">+50 bonus XP</span></div>
                <div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${Object.values(daily.checks).filter(Boolean).length / tasks.length * 100}%` }} /></div>
                <div className="lq-challenge-list">{tasks.map((task) => <div className="lq-check-row" key={task.id}><span className={`lq-check-icon${daily.checks[task.id] ? " done" : ""}`}>{daily.checks[task.id] ? "✓" : ""}</span><span>{task.text}</span><span className="lq-muted" style={{ marginLeft: "auto" }}>{daily.checks[task.id] ? "Done" : "Whenever you're ready"}</span></div>)}</div>
                <p className="lq-muted" style={{ marginTop: 17 }}>Your streak counts days you practise. If you miss a day, you can simply pick it up again when you're ready.</p>
              </section>
            </>
          );
        }

        function renderProgress() {
          const weekScores = profile.pronunciationScores.slice(-7);
          return (
            <>
              <PageHeader kicker="Your progress" title="Look how far you've come." copy="A gentle record of your practice. Speech scores are approximate matches from browser recognition." />
              <div className="lq-stat-grid">
                {[
                  ["Words learned", profile.wordsLearned, "words", "unique words"],
                  ["Activities", profile.lessons, "spark", "rounds completed"],
                  ["Speaking tries", profile.speakingExercises, "speak", "practice attempts"],
                  ["Practice time", `${profile.minutes}m`, "clock", "time in practice"],
                ].map(([label, value, icon, foot]) => <div className="lq-stat" key={label}><div className="lq-stat-top"><span>{label}</span><Icon name={icon} className="lq-stat-icon" size={18} /></div><strong className="lq-stat-value">{value}</strong><span className="lq-stat-foot">{foot}</span></div>)}
              </div>
              <div className="lq-two-col">
                <section className="lq-card">
                  <div className="lq-card-heading"><h2 className="lq-card-title">Recent speech-to-text matches</h2>{averagePronunciation > 0 && <span className="lq-pill">{averagePronunciation}% average</span>}</div>
                  {weekScores.length ? <div className="lq-chart" aria-label="Recent approximate speech matching scores">{weekScores.map((score, index) => <div className="lq-chart-column" key={`${index}-${score}`}><span className="lq-chart-value">{score}%</span><div className="lq-chart-bar" style={{ height: `${Math.max(4, score)}%` }} /><span className="lq-chart-label">Try {index + 1}</span></div>)}</div> : <p className="lq-muted">Your first speaking attempt will start this chart. These are approximate transcript matches, not scientific pronunciation measurements.</p>}
                </section>
                <section className="lq-card"><h2 className="lq-card-title">A few more ways to grow</h2><div className="lq-challenge-list" style={{ marginTop: 13 }}>{[["Vocabulary", Math.min(100, profile.wordsLearned * 4)], ["Lessons", Math.min(100, profile.lessons * 10)], ["Conversation", Math.min(100, profile.conversations * 20)]].map(([label, value]) => <div key={label}><div className="lq-progress-meta"><span>{label}</span><span>{value}%</span></div><div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${value}%` }} /></div></div>)}</div><p className="lq-muted">Current streak: {profile.streak} {profile.streak === 1 ? "day" : "days"}</p></section>
              </div>
            </>
          );
        }

        function renderAchievements() {
          return (
            <>
              <PageHeader kicker="Little milestones" title="Every step deserves a badge." copy="Keep learning your way. These badges unlock naturally as you practise." />
              <section className="lq-card" style={{ marginBottom: 15 }}><strong>{earnedBadges.length} of {badgeCatalog.length} badges collected</strong><div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${earnedBadges.length / badgeCatalog.length * 100}%` }} /></div></section>
              <div className="lq-badge-grid">{badgeCatalog.map((badge) => <article className={`lq-badge${currentBadgeNames.has(badge.id) ? "" : " locked"}`} key={badge.id}><div className="lq-badge-icon" aria-hidden="true"><Icon name={badge.icon} size={23} /></div><div className="lq-badge-title">{badge.title}</div><p className="lq-badge-copy">{badge.text}</p><span className="lq-badge-copy">{currentBadgeNames.has(badge.id) ? "Collected ✓" : "Keep practising"}</span></article>)}</div>
            </>
          );
        }

        function renderMistakes() {
          return (
            <>
              <PageHeader
                kicker={`${language} · Personal review`}
                title="Your tricky words and phrases."
                copy="When an answer takes a few tries, we save it here so you can revisit it. No grades and no judgement—just practice that fits you."
                action={languageMistakes.length > 0 && <button className="lq-primary" onClick={beginMistakeReview} type="button">Practise these →</button>}
              />
              {languageMistakes.length === 0 ? (
                <section className="lq-practice-card" style={{ maxWidth: 700 }}>
                  <h2>Nothing to review just yet.</h2>
                  <p>As you practise, we'll keep track of words and phrases that take a little extra effort. You can find them here whenever you want another go.</p>
                  <button className="lq-primary" onClick={() => changeTab("learn")} type="button">Choose an activity →</button>
                </section>
              ) : (
                <>
                  <section className="lq-card" style={{ maxWidth: 760, marginBottom: 14 }}>
                    <div className="lq-card-heading">
                      <h2 className="lq-card-title">{languageMistakes.length} {languageMistakes.length === 1 ? "thing" : "things"} to practise</h2>
                      <span className="lq-pill">Picked for you</span>
                    </div>
                    <p className="lq-muted" style={{ marginBottom: 0 }}>We’ll bring these back in a short review. Get one right twice in a row and it will leave your list.</p>
                  </section>
                  <div className="lq-challenge-list" style={{ maxWidth: 760 }}>
                    {languageMistakes.map((item) => (
                      <article className="lq-card" key={`${item.language}-${item.kind}-${item.word}`}>
                        <div className="lq-card-heading">
                          <h2 className="lq-card-title" lang={languageInfo.locale}>{item.word}</h2>
                          <span className="lq-pill">{item.correctStreak ? "Getting there" : `${item.missCount} ${item.missCount === 1 ? "retry" : "retries"}`}</span>
                        </div>
                        <p className="lq-muted" style={{ margin: 0 }}>{item.meaning}</p>
                        <span className="lq-stat-foot">{item.kind === "phrase" ? "Phrase practice" : "Vocabulary"} · {item.correctStreak ? "One more correct answer to move on" : "Ready for another try"}</span>
                      </article>
                    ))}
                  </div>
                  <p className="lq-muted" style={{ marginTop: 14 }}>This list stays on this device and is saved with your learning progress.</p>
                </>
              )}
            </>
          );
        }

        function renderVocabulary() {
          if (gameRound.length && gameMode === "flashcards") return renderLearn();
          return (
            <>
              <PageHeader kicker={`${language} word garden`} title="Words you've met so far." copy={`${profile.wordsLearned} unique ${profile.wordsLearned === 1 ? "word" : "words"} learned. Select listen to hear a word, or try the flashcards.`} action={<button className="lq-primary" onClick={() => beginGame("flashcards")} type="button">Study flashcards <Icon name="arrow" size={17} /></button>} />
              <div className="lq-activity-grid">{vocabulary.map((item) => {
                const known = profile.knownWords.includes(`${language}:${item.word}`);
                return <article className="lq-card" key={item.word}><div className="lq-card-heading"><h2 className="lq-card-title">{item.meaning}</h2><span>{known ? "✓" : ""}</span></div><p className="lq-target-text" lang={languageInfo.locale} style={{ fontSize: "1.55rem" }}>{item.word}</p><p className="lq-muted">Say it like: {item.hint}</p><button className="lq-secondary" onClick={() => playAudio(item.word)} type="button"><Icon name="audio" size={17} /> Listen</button></article>;
              })}</div>
            </>
          );
        }

        function renderProfile() {
          return (
            <>
              <PageHeader kicker="Your learning profile" title="Make this journey yours." copy="Change your preferences whenever you'd like. Your saved progress stays on this device." />
              {storageNotice && <div className="lq-notice" role="status">{storageNotice}</div>}
              <section className="lq-card">
                <div className="lq-preference-grid">
                  <label className="lq-form-field"><span className="lq-form-label">What should we call you?</span><input className="lq-input" value={profile.name} maxLength="24" onChange={(event) => setProfile((current) => ({ ...current, name: event.target.value }))} /></label>
                  <label className="lq-form-field"><span className="lq-form-label">Your first language</span><select className="lq-select" value={profile.nativeLanguage} onChange={(event) => setProfile((current) => ({ ...current, nativeLanguage: event.target.value }))}>{["English", ...languageNames.map((item) => item.name)].map((name) => <option key={name}>{name}</option>)}</select></label>
                  <label className="lq-form-field"><span className="lq-form-label">Language you're learning</span><select className="lq-select" value={language} onChange={(event) => setLanguage(event.target.value)}>{languageNames.map((item) => <option key={item.name} value={item.name}>{item.name}</option>)}</select></label>
                  <label className="lq-form-field"><span className="lq-form-label">Your comfort level</span><select className="lq-select" value={profile.difficulty} onChange={(event) => setProfile((current) => ({ ...current, difficulty: event.target.value }))}>{["Beginner", "Intermediate", "Advanced"].map((level) => <option key={level}>{level}</option>)}</select></label>
                </div>
                <div className="lq-level-card" style={{ marginTop: 7, maxWidth: 490 }}><span className="lq-level-mark" aria-hidden="true"><Icon name="leaf" size={22} /></span><h2 className="lq-card-title">Level {levelIndex + 1} · {levelNames[levelIndex]}</h2><div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${levelProgress}%` }} /></div><div className="lq-progress-meta"><span>{profile.xp} XP</span><span>{nextLevelXp} XP next level</span></div></div>
                <div style={{ marginTop: 18 }}><button className="lq-sidebar-link" onClick={() => changeTab("achievements")} type="button">View your {earnedBadges.length} earned badges →</button></div>
              </section>
            </>
          );
        }

        function renderMore() {
          return (
            <>
              <PageHeader kicker="Your learning space" title="What would you like to explore?" copy="Your words, conversations, milestones, and personal settings are all here." />
              <div className="lq-activity-grid">
                {[
                  ["vocabulary", "words", "My vocabulary", `${profile.wordsLearned} words learned`],
                  ["mistakes", "quiz", "Mistake memory", languageMistakes.length ? `${languageMistakes.length} to practise again` : "Your personal review list"],
                  ["conversation", "conversation", "Conversation room", "Practise a friendly chat"],
                  ["achievements", "medal", "Achievements", `${earnedBadges.length} badges collected`],
                  ["profile", "profile", "My profile", "Language and level preferences"],
                ].map(([id, icon, title, copy]) => <button className="lq-activity" key={id} onClick={() => id === "conversation" ? startConversation() : changeTab(id)} type="button"><span className="lq-activity-icon" aria-hidden="true"><Icon name={icon} size={22} /></span><span className="lq-activity-title">{title}</span><span className="lq-activity-copy">{copy}</span></button>)}
              </div>
            </>
          );
        }

        if (tab === "landing") return renderLanding();

        let content;
        if (tab === "home") content = renderHome();
        else if (tab === "learn") content = renderLearn();
        else if (tab === "speak") content = renderSpeaking();
        else if (tab === "conversation") content = renderConversation();
        else if (tab === "challenges") content = renderChallenges();
        else if (tab === "progress") content = renderProgress();
        else if (tab === "achievements") content = renderAchievements();
        else if (tab === "vocabulary") content = renderVocabulary();
        else if (tab === "profile") content = renderProfile();
        else if (tab === "mistakes") content = renderMistakes();
        else content = renderMore();

        return (
          <div className="lq-app">
            <aside className="lq-sidebar">
              <div className="lq-brand"><span className="lq-brand-mark" aria-hidden="true"><Icon name="brand" size={23} /></span><span className="wg-wordmark"><span>word</span> <em>garden</em></span></div>
              <p className="lq-nav-label">Your space</p>
              <nav className="lq-nav" aria-label="Main navigation">
                {navItems.map((item) => <button className={`lq-nav-button${tab === item.id ? " active" : ""}`} key={item.id} onClick={() => changeTab(item.id)} type="button"><span className="lq-nav-icon" aria-hidden="true"><Icon name={item.icon} size={19} /></span>{item.label}</button>)}
              </nav>
              <div className="lq-sidebar-spacer" />
              <section className="lq-sidebar-card"><h2 className="lq-sidebar-card-title">A small next step</h2><p className="lq-sidebar-card-copy">{profile.speakingExercises && averagePronunciation < 80 ? "Try a tricky phrase again, one word at a time." : "A little speaking practice can help today's words stick."}</p><button className="lq-sidebar-link" onClick={() => changeTab("speak")} type="button">Give it a try →</button></section>
              <button className="lq-user" onClick={() => changeTab("profile")} type="button" style={{ width: "100%", border: 0, background: "transparent", textAlign: "left", cursor: "pointer" }}><span className="lq-avatar" aria-hidden="true"><Icon name="profile" size={19} /></span><span><span className="lq-user-name">{profile.name || "Learner"}</span><br /><span className="lq-user-level">Level {levelIndex + 1} · {levelNames[levelIndex]}</span></span></button>
            </aside>
            <main className="lq-main">
              <div className="lq-topbar">
                <span className="lq-breadcrumb">Your space <span aria-hidden="true">/</span> {navItems.find((item) => item.id === tab)?.label || (tab === "conversation" ? "Conversation" : tab === "vocabulary" ? "Vocabulary" : tab === "mistakes" ? "Mistake memory" : tab === "achievements" ? "Achievements" : "Profile")}</span>
                <div className="lq-top-actions"><span className="lq-pill">{language}</span><span className="lq-pill"><Icon name="spark" size={15} /> {profile.xp} XP</span><span className="lq-pill"><Icon name="clock" size={15} /> {profile.streak}</span></div>
              </div>
              <div className="lq-content">
                {storageNotice && tab !== "speak" && tab !== "profile" && <div className="lq-notice" role="status">{storageNotice}</div>}
                {content}
              </div>
            </main>
            {toast && <div className="lq-toast" role="status" aria-live="polite">{toast}</div>}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
