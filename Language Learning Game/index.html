<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build language skills with friendly vocabulary, speaking, and conversation practice."
    />
    <title>Word Garden — A little language practice</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        font-family: "DM Sans", sans-serif;
        color: #29372f;
        background: #f4f2e9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      #root { min-height: 100vh; background: #f6f4eb; }

      button,
      select {
        font: inherit;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #d18a55;
        outline-offset: 3px;
      }

      .page {
        display: grid;
        min-height: 100vh;
        padding: 30px 18px;
        place-items: center;
        background-image: radial-gradient(#dddaca 0.7px, transparent 0.7px);
        background-position: -3px -3px;
        background-size: 22px 22px;
      }

      .game {
        width: min(100%, 540px);
        padding: clamp(24px, 6vw, 42px);
        border: 1px solid #e8e4d7;
        border-radius: 26px;
        background: #fffdf7;
        box-shadow: 0 18px 50px rgb(64 70 47 / 10%);
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #437b5b;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .brand-icon {
        display: grid;
        width: 32px;
        height: 32px;
        border-radius: 11px;
        background: #e8f0df;
        font-size: 1rem;
        place-items: center;
      }

      .language-select {
        min-height: 38px;
        padding: 0 28px 0 11px;
        border: 1px solid #e4e5da;
        border-radius: 10px;
        background: #fffefa;
        color: #46564b;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .intro {
        margin: 32px 0 26px;
      }

      .eyebrow {
        margin: 0 0 9px;
        color: #bc7750;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #29372f;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2.1rem, 7vw, 3.1rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 1.1;
      }

      .intro-copy {
        margin: 12px 0 0;
        color: #778078;
        font-size: 0.94rem;
        line-height: 1.6;
      }

      .progress-row {
        display: flex;
        margin-bottom: 10px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #788179;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .progress-track {
        height: 7px;
        margin-bottom: 27px;
        overflow: hidden;
        border-radius: 99px;
        background: #ecece3;
      }

      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: #79a779;
        transition: width 280ms ease;
      }

      .question-card {
        padding: 24px 20px;
        border: 1px solid #ece8dc;
        border-radius: 19px;
        background: #f9f7ef;
        text-align: center;
      }

      .question-prompt {
        margin: 0 0 11px;
        color: #7b847b;
        font-size: 0.82rem;
      }

      .word {
        margin: 0;
        color: #33473a;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2.5rem, 10vw, 4rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 1.12;
      }

      .word-hint {
        margin: 9px 0 0;
        color: #a0a296;
        font-size: 0.82rem;
      }

      .answers-label {
        margin: 25px 0 11px;
        color: #68736b;
        font-size: 0.79rem;
        font-weight: 700;
      }

      .answers {
        display: grid;
        gap: 10px;
      }

      .answer-button {
        display: flex;
        min-height: 54px;
        padding: 0 15px;
        align-items: center;
        gap: 12px;
        border: 1px solid #e7e8df;
        border-radius: 13px;
        background: #fff;
        color: #3c4b40;
        cursor: pointer;
        text-align: left;
        transition:
          border-color 150ms ease,
          background-color 150ms ease,
          transform 150ms ease;
      }

      .answer-button:not(:disabled):hover {
        transform: translateY(-1px);
        border-color: #aac5a6;
        background: #f7faf3;
      }

      .answer-letter {
        display: grid;
        width: 27px;
        height: 27px;
        flex: 0 0 auto;
        border-radius: 9px;
        background: #f0f1e9;
        color: #6f796e;
        font-size: 0.75rem;
        font-weight: 800;
        place-items: center;
      }

      .answer-text {
        font-size: 0.9rem;
        font-weight: 650;
      }

      .answer-button.correct {
        border-color: #8eb99b;
        background: #eef7ee;
        color: #326944;
      }

      .answer-button.correct .answer-letter {
        background: #d9ebd9;
        color: #326944;
      }

      .answer-button.incorrect {
        border-color: #e4a7a0;
        background: #fff1ee;
        color: #9c4c43;
      }

      .answer-button.incorrect .answer-letter {
        background: #f9dcd6;
        color: #9c4c43;
      }

      .answer-button:disabled {
        cursor: default;
      }

      .feedback {
        min-height: 25px;
        margin: 15px 0 0;
        color: #788179;
        font-size: 0.85rem;
        font-weight: 700;
        text-align: center;
      }

      .feedback.good {
        color: #36764a;
      }

      .feedback.try-again {
        color: #a55846;
      }

      .next-button,
      .play-again {
        width: 100%;
        min-height: 52px;
        margin-top: 15px;
        border: 0;
        border-radius: 13px;
        background: #467c59;
        color: #fff;
        cursor: pointer;
        font-size: 0.92rem;
        font-weight: 800;
        transition:
          background-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .next-button:hover,
      .play-again:hover {
        transform: translateY(-1px);
        background: #376a49;
        box-shadow: 0 7px 15px rgb(57 109 72 / 18%);
      }

      .next-button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .score-card {
        padding: 27px 21px;
        border: 1px solid #e5e9d9;
        border-radius: 18px;
        background: #f4f7ec;
        text-align: center;
      }

      .score-emoji {
        margin: 0 0 7px;
        font-size: 2.7rem;
      }

      .score-title {
        margin: 0;
        color: #344a39;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.75rem;
        letter-spacing: -0.04em;
      }

      .score-copy {
        margin: 10px 0 0;
        color: #6d786d;
        line-height: 1.6;
      }

      .score-number {
        color: #39734c;
        font-size: 1.1rem;
        font-weight: 800;
      }

      .small-note {
        margin: 21px 0 0;
        color: #9a9e90;
        font-size: 0.75rem;
        line-height: 1.5;
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 420px) {
        .page {
          padding: 15px 12px;
        }

        .game {
          padding: 23px 18px;
          border-radius: 21px;
        }

        .intro {
          margin-top: 25px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      .lq-app { display: grid; min-height: 100vh; grid-template-columns: 230px minmax(0, 1fr); background: #f5f3e9; color: #243b31; }
      .lq-sidebar { position: sticky; top: 0; display: flex; height: 100vh; padding: 27px 17px 19px; flex-direction: column; border-right: 1px solid #e8ece6; background: rgb(255 254 250 / 94%); }
      .lq-brand { display: flex; margin: 0 0 27px; align-items: center; gap: 10px; color: #29372f; font-family: Fraunces, Georgia, serif; font-size: 1.2rem; font-weight: 700; }
      .lq-brand-mark { display: grid; width: 37px; height: 37px; border-radius: 13px; background: #e6f1df; color: #518363; font-family: "DM Sans", sans-serif; font-size: 1.2rem; place-items: center; }
      .lq-nav-label { margin: 0 0 9px 10px; color: #a0a69d; font-size: .66rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      .lq-nav { display: grid; gap: 5px; }
      .lq-nav-button { display: flex; width: 100%; min-height: 42px; padding: 0 10px; align-items: center; gap: 10px; border: 0; border-radius: 11px; background: transparent; color: #69746b; cursor: pointer; font-family: inherit; font-size: .82rem; font-weight: 700; text-align: left; }
      .lq-nav-button:hover, .lq-nav-button.active { background: #eaf2e8; color: #3c7651; }
      .lq-nav-icon { display: grid; width: 21px; height: 21px; font-size: 1rem; place-items: center; }
      .lq-sidebar-spacer { flex: 1; }
      .lq-sidebar-card { padding: 14px; border: 1px solid #e9ecdf; border-radius: 14px; background: #f8f8ef; }
      .lq-sidebar-card-title { margin: 0; color: #48584a; font-size: .78rem; font-weight: 800; }
      .lq-sidebar-card-copy { margin: 6px 0 10px; color: #828a7d; font-size: .72rem; line-height: 1.5; }
      .lq-sidebar-link { padding: 0; border: 0; background: none; color: #4a815d; cursor: pointer; font-family: inherit; font-size: .76rem; font-weight: 800; }
      .lq-user { display: flex; margin-top: 16px; padding: 12px 3px 0; align-items: center; gap: 10px; border-top: 1px solid #edf0e9; }
      .lq-avatar { display: grid; width: 36px; height: 36px; flex: 0 0 auto; border: 1px solid #edd6bc; border-radius: 50%; background: #f4e5d4; color: #8e6546; font-size: 1.1rem; place-items: center; }
      .lq-user-name { color: #36453b; font-size: .78rem; font-weight: 800; }
      .lq-user-level { margin-top: 2px; color: #90988f; font-size: .68rem; }
      .lq-main { min-width: 0; padding: 26px clamp(17px, 4vw, 48px) 45px; }
      .lq-topbar { display: flex; max-width: 1080px; min-height: 42px; margin: 0 auto 27px; align-items: center; justify-content: space-between; gap: 15px; }
      .lq-breadcrumb { color: #879088; font-size: .77rem; }
      .lq-top-actions { display: flex; align-items: center; gap: 9px; }
      .lq-pill { display: inline-flex; min-height: 33px; padding: 0 10px; align-items: center; gap: 5px; border: 1px solid #e8ebe3; border-radius: 999px; background: #fffefa; color: #647268; font-size: .72rem; font-weight: 750; }
      .lq-content { width: min(100%, 1080px); margin: 0 auto; }
      .lq-welcome { display: flex; margin-bottom: 22px; padding: 24px 26px; align-items: center; justify-content: space-between; gap: 18px; border: 1px solid #e5eadf; border-radius: 19px; background: linear-gradient(115deg, #fffefa 0%, #f8f8ed 70%, #f1f5e9 100%); box-shadow: 0 6px 20px rgb(50 64 49 / 3%); }
      .lq-kicker { margin: 0 0 8px; color: #588468; font-size: .69rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .lq-title { margin: 0; color: #2b3930; font-family: Fraunces, Georgia, serif; font-size: clamp(1.9rem, 4vw, 2.55rem); font-weight: 600; letter-spacing: -.055em; line-height: 1.12; }
      .lq-subtitle { max-width: 550px; margin: 9px 0 0; color: #68766b; font-size: .9rem; line-height: 1.65; }
      .lq-primary, .lq-secondary, .lq-danger { display: inline-flex; min-height: 44px; padding: 0 16px; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: .82rem; font-weight: 800; text-decoration: none; transition: .16s ease; }
      .lq-primary { background: #477d59; color: #fff; }
      .lq-primary:hover:not(:disabled) { transform: translateY(-1px); background: #376b49; box-shadow: 0 7px 15px rgb(62 112 76 / 17%); }
      .lq-primary:disabled { cursor: not-allowed; opacity: .52; }
      .lq-secondary { border: 1px solid #e3e8dd; background: #fffefa; color: #56705e; }
      .lq-secondary:hover { border-color: #b8cead; background: #f8faf5; }
      .lq-danger { border: 1px solid #f0d7d0; background: #fff8f6; color: #a2594b; }
      .lq-card { min-width: 0; padding: 19px; border: 1px solid #e8ebe3; border-radius: 17px; background: #fffefa; box-shadow: 0 5px 16px rgb(50 64 49 / 4%); }
      .lq-card-heading { display: flex; margin-bottom: 13px; align-items: center; justify-content: space-between; gap: 10px; }
      .lq-card-title { margin: 0; color: #37463c; font-size: .88rem; font-weight: 800; }
      .lq-muted { color: #869087; font-size: .75rem; line-height: 1.55; }
      .lq-stat-grid { display: grid; margin-bottom: 17px; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
      .lq-stat { padding: 16px; border: 1px solid #e8ebe3; border-radius: 15px; background: #fffefa; box-shadow: 0 3px 12px rgb(50 64 49 / 2%); }
      .lq-stat-top { display: flex; align-items: center; justify-content: space-between; gap: 7px; color: #829087; font-size: .7rem; font-weight: 700; }
      .lq-stat-value { display: block; margin-top: 9px; color: #32453a; font-family: Fraunces, Georgia, serif; font-size: 1.65rem; font-weight: 600; letter-spacing: -.05em; }
      .lq-stat-foot { display: block; margin-top: 3px; color: #9aa096; font-size: .66rem; }
      .lq-dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(250px, .9fr); gap: 14px; }
      .lq-level-card { padding: 21px; border: 1px solid #dfe9d7; border-radius: 17px; background: radial-gradient(circle at 92% 12%, rgb(224 238 206 / 82%), transparent 32%), linear-gradient(130deg, #f4f7e9, #f1f6ee); }
      .lq-level-mark { display: grid; width: 49px; height: 49px; margin-bottom: 12px; border: 1px solid #dbe5d0; border-radius: 15px; background: #fffefa; font-size: 1.5rem; place-items: center; }
      .lq-level-card .lq-card-title { font-size: 1.04rem; }
      .lq-progress-track { height: 8px; margin: 12px 0 7px; overflow: hidden; border-radius: 99px; background: #e4e9dd; }
      .lq-progress-fill { height: 100%; border-radius: inherit; background: #78a875; transition: width 250ms ease; }
      .lq-progress-meta { display: flex; justify-content: space-between; gap: 10px; color: #768370; font-size: .69rem; }
      .lq-challenge-list { display: grid; gap: 9px; }
      .lq-check-row { display: flex; align-items: center; gap: 8px; color: #637067; font-size: .77rem; }
      .lq-check-icon { display: grid; width: 19px; height: 19px; flex: 0 0 auto; border: 1px solid #dfe5d8; border-radius: 6px; color: #fff; font-size: .68rem; place-items: center; }
      .lq-check-icon.done { border-color: #74a27a; background: #74a27a; }
      .lq-section-heading { display: flex; margin: 24px 0 12px; align-items: center; justify-content: space-between; gap: 10px; }
      .lq-section-heading h2 { margin: 0; color: #35443a; font-family: Fraunces, Georgia, serif; font-size: 1.2rem; letter-spacing: -.03em; }
      .lq-activity-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
      .lq-activity { display: flex; min-height: 124px; padding: 16px; flex-direction: column; align-items: flex-start; border: 1px solid #e8ebe4; border-radius: 15px; background: #fffefa; color: inherit; cursor: pointer; font-family: inherit; text-align: left; transition: .16s ease; }
      .lq-activity:hover { transform: translateY(-2px); border-color: #bfd1b7; box-shadow: 0 8px 17px rgb(51 78 56 / 7%); }
      .lq-activity-icon, .lq-game-icon { display: grid; width: 36px; height: 36px; margin-bottom: 10px; border-radius: 12px; background: #eff3e7; font-size: 1.1rem; place-items: center; }
      .lq-activity-title, .lq-game-name { color: #3b4b40; font-size: .8rem; font-weight: 800; }
      .lq-activity-copy, .lq-game-detail { margin-top: 4px; color: #899188; font-size: .68rem; line-height: 1.4; }
      .lq-two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(250px, .85fr); gap: 14px; }
      .lq-practice-card { padding: 21px; border: 1px solid #e4eade; border-radius: 17px; background: radial-gradient(circle at 86% 18%, rgb(246 225 185 / 62%), transparent 25%), #f1f5e9; }
      .lq-practice-card h2 { margin: 0; color: #314638; font-family: Fraunces, Georgia, serif; font-size: 1.4rem; letter-spacing: -.04em; }
      .lq-practice-card p { max-width: 420px; margin: 8px 0 15px; color: #748174; font-size: .81rem; line-height: 1.55; }
      .lq-game-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .lq-game-card { display: flex; min-height: 82px; padding: 12px; align-items: center; gap: 10px; border: 1px solid #e8ebe4; border-radius: 13px; background: #fffefa; color: inherit; cursor: pointer; font-family: inherit; text-align: left; }
      .lq-game-card:hover { transform: translateY(-2px); border-color: #bcd0b7; }
      .lq-game-icon { width: 36px; height: 36px; margin: 0; flex: 0 0 auto; }
      .lq-select, .lq-input, .lq-textarea { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #e0e6dc; border-radius: 10px; outline: 0; background: #fffefa; color: #34443a; font: inherit; font-size: .81rem; }
      .lq-textarea { min-height: 82px; resize: vertical; }
      .lq-select:focus, .lq-input:focus, .lq-textarea:focus { border-color: #82ad8a; box-shadow: 0 0 0 3px rgb(110 158 119 / 13%); }
      .lq-form-field { display: grid; margin-bottom: 13px; gap: 6px; }
      .lq-form-label { color: #5f6f63; font-size: .74rem; font-weight: 750; }
      .lq-speak-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(240px, .75fr); gap: 14px; }
      .lq-speak-target { padding: 22px; border: 1px solid #e8ebe0; border-radius: 17px; background: linear-gradient(145deg, #f8f8ee, #f1f5e9); text-align: center; }
      .lq-target-label { margin: 0 0 11px; color: #798478; font-size: .75rem; }
      .lq-target-text { margin: 0; color: #34483a; font-family: Fraunces, Georgia, serif; font-size: clamp(1.55rem, 4vw, 2.35rem); letter-spacing: -.04em; line-height: 1.3; }
      .lq-target-translation { margin: 8px 0 0; color: #899186; font-size: .77rem; }
      .lq-audio-row { display: flex; margin-top: 17px; flex-wrap: wrap; justify-content: center; gap: 8px; }
      .lq-mic-panel { display: grid; min-height: 230px; padding: 19px; justify-items: center; align-content: center; border: 1px solid #e8ebe3; border-radius: 17px; background: #fffefa; text-align: center; }
      .lq-mic-button { display: grid; width: 76px; height: 76px; margin: 0 auto 11px; border: 0; border-radius: 50%; background: #497e5a; box-shadow: 0 9px 22px rgb(69 123 85 / 22%); color: #fff; cursor: pointer; font-size: 1.8rem; place-items: center; }
      .lq-mic-button.listening { animation: lq-pulse 1.15s ease-in-out infinite; background: #bd634c; }
      @keyframes lq-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgb(189 99 76 / 27%); } 50% { box-shadow: 0 0 0 12px rgb(189 99 76 / 0%); } }
      .lq-mic-title { margin: 0; color: #46564b; font-size: .83rem; font-weight: 800; }
      .lq-mic-hint { max-width: 290px; margin: 6px 0 0; color: #8a938a; font-size: .71rem; line-height: 1.5; }
      .lq-transcript-label { display: block; margin: 15px 0 6px; color: #647168; font-size: .73rem; font-weight: 750; text-align: left; }
      .lq-feedback-card { margin-top: 14px; padding: 16px; border: 1px solid #e3eade; border-radius: 14px; background: #f8faf4; }
      .lq-score-row { display: flex; margin-bottom: 12px; align-items: center; gap: 12px; }
      .lq-score-circle { display: grid; width: 62px; height: 62px; flex: 0 0 auto; border: 5px solid #83ae7d; border-radius: 50%; background: #fff; color: #3f754c; font-size: 1rem; font-weight: 800; place-items: center; }
      .lq-word-feedback { display: flex; margin-top: 9px; flex-wrap: wrap; gap: 6px; }
      .lq-word-chip { padding: 5px 8px; border: 1px solid #e5e9e1; border-radius: 8px; background: #fff; color: #5a6b5d; font-size: .7rem; }

      function readProfile() {
        const fallback = createDefaultProfile();
        try {

          if (!saved) return fallback;
          const parsed = JSON.parse(saved);
          const validLanguage = languageNames.some((item) => item.name === parsed.language);

          return {

        } catch {

        }
      }

      function normalizeWords(text) {
        return text
          .toLocaleLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[¿¡.,!?;:，。！？、؟؛]/g, " ")
          .replace(/[^\p{L}\p{N}\s'-]/gu, " ")
          .split(/\s+/)
          .filter(Boolean);
      }

      function compareSpeech(target, spoken) {
        const expected = normalizeWords(target);
        const heard = normalizeWords(spoken);
        const rows = Array.from({ length: expected.length + 1 }, () =>
          Array(heard.length + 1).fill(0),
        );

        for (let i = expected.length - 1; i >= 0; i -= 1) {
          for (let j = heard.length - 1; j >= 0; j -= 1) {
            rows[i][j] =
              expected[i] === heard[j]
                ? 1 + rows[i + 1][j + 1]
                : Math.max(rows[i + 1][j], rows[i][j + 1]);
          }
        }

        const matched = [];
        const missing = [];
        const extra = [];
        let i = 0;
        let j = 0;
        while (i < expected.length && j < heard.length) {
          if (expected[i] === heard[j]) {
            matched.push(expected[i]);
            i += 1;
            j += 1;
          } else if (rows[i + 1][j] >= rows[i][j + 1]) {
            missing.push(expected[i]);
            i += 1;
          } else {
            extra.push(heard[j]);
            j += 1;
          }
        }
        while (i < expected.length) missing.push(expected[i++]);
        while (j < heard.length) extra.push(heard[j++]);

        return {
          matched,
          missing,
          extra,
          score: expected.length
            ? Math.max(0, Math.round((matched.length / Math.max(expected.length, heard.length)) * 100))
            : 0,
        };
      }

      function shuffle(items) {
        const shuffled = [...items];
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const otherIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[otherIndex]] = [
            shuffled[otherIndex],
            shuffled[index],
          ];
        }
        return shuffled;
      }

      function makeRound(language) {
        const allWords = wordSets[language];
        return shuffle(allWords)
          .slice(0, questionCount)
          .map((question) => ({
            ...question,
            choices: shuffle([
              question.meaning,
              ...shuffle(
                allWords
                  .filter((item) => item.meaning !== question.meaning)
                  .map((item) => item.meaning),
              ).slice(0, 3),
            ]),
          }));
      }

        function startRound(nextLanguage = language) {
          setLanguage(nextLanguage);
          setQuestions(makeRound(nextLanguage));
          setQuestionIndex(0);
          setSelectedAnswer(null);
          setScore(0);
          setFinished(false);
        }

        function chooseAnswer(answer) {
          if (selectedAnswer !== null) {
            return;
          }

          setSelectedAnswer(answer);
          if (answer === currentQuestion.meaning) {
            setScore((currentScore) => currentScore + 1);
          }
        }

        function goToNextQuestion() {
          if (questionIndex === questions.length - 1) {
            setFinished(true);
            return;
          }

          setQuestionIndex((index) => index + 1);
          setSelectedAnswer(null);

          startRound(event.target.value);

                        answerClass += " correct";
                      } else if (selectedAnswer === answer) {

                      }

                      return (
                        <button
                          className={answerClass}

      function App() {
        const [profile, setProfile] = useState(readProfile);

        const [typedAnswer, setTypedAnswer] = useState("");

        const [gameNote, setGameNote] = useState("");

        const [matchRight, setMatchRight] = useState("");
        const [matchedPairs, setMatchedPairs] = useState([]);
        const [matchOptions, setMatchOptions] = useState([]);
        const [phraseIndex, setPhraseIndex] = useState(0);
        const [speechState, setSpeechState] = useState("idle");
        const [speechMessage, setSpeechMessage] = useState("");
        const [transcript, setTranscript] = useState("");

        const [conversationScenario, setConversationScenario] = useState("Introductions");

        const [conversationAnswer, setConversationAnswer] = useState("");
        const [conversationMessages, setConversationMessages] = useState([]);
        const [conversationFinished, setConversationFinished] = useState(false);
        const recognitionRef = useRef(null);

        const language = profile.language;
        const languageInfo = languageNames.find((item) => item.name === language) || languageNames[0];
        const vocabulary = makeVocabulary(language);
        const phrases = phraseData[language];
        const currentPhrase = phrases[phraseIndex % phrases.length];
        const currentQuestion = gameRound[gameIndex];
        const today = localDayKey();
        const daily = profile.daily.day === today
          ? profile.daily
          : { day: today, checks: { vocabulary: false, speaking: false, conversation: false, score: false }, bonusAwarded: false };
        const levelIndex = Math.max(0, levelThresholds.findIndex((threshold, index) =>
          profile.xp < (levelThresholds[index + 1] ?? Infinity),
        ));
        const nextLevelXp = levelThresholds[levelIndex + 1] ?? levelThresholds[levelIndex];
        const currentLevelXp = levelThresholds[levelIndex];
        const languageMistakes = profile.mistakes
          .filter((item) => item.language === language)
          .sort((left, right) => right.missCount - left.missCount);
        const levelProgress = levelIndex === levelNames.length - 1
          ? 100
          : Math.min(100, Math.round(((profile.xp - currentLevelXp) / (nextLevelXp - currentLevelXp)) * 100));
        const averagePronunciation = profile.pronunciationScores.length
          ? Math.round(profile.pronunciationScores.reduce((sum, value) => sum + value, 0) / profile.pronunciationScores.length)
          : 0;
        const earnedBadges = badgeCatalog.filter((badge) => badge.unlocked(profile));
        const dailyComplete = Object.values(daily.checks).every(Boolean);
        const speechSupported = Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);

        useEffect(() => {
          try {
            window.localStorage.setItem("lingoquest-profile", JSON.stringify(profile));
            setStorageNotice("");
          } catch {
            setStorageNotice("Progress could not be saved on this device. Your practice will continue until you close this page.");
          }
        }, [profile]);

        useEffect(() => () => {
          if (recognitionRef.current) recognitionRef.current.stop();
          if (window.speechSynthesis) window.speechSynthesis.cancel();
        }, []);

        function showToast(message) {
          setToast(message);
          window.setTimeout(() => setToast(""), 2600);
        }

        function awardXp(amount, reason) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yesterdayKey = localDayKey(yesterday);
          setProfile((current) => {
            const streak = current.lastPractice === today
              ? current.streak
              : current.lastPractice === yesterdayKey
                ? current.streak + 1
                : 1;
            return {
              ...current,
              xp: current.xp + amount,
              streak,
              lastPractice: today,
              minutes: current.minutes + 1,
              history: [...current.history, { day: today, xp: amount, action: reason }].slice(-40),
            };
          });
          showToast(`${reason} · +${amount} XP`);
        }

        function markDaily(task) {
          const currentDaily = profile.daily.day === today
            ? profile.daily
            : { day: today, checks: { vocabulary: false, speaking: false, conversation: false, score: false }, bonusAwarded: false };
          const nextChecks = currentDaily.checks[task]
            ? currentDaily.checks
            : { ...currentDaily.checks, [task]: true };
          const earnedBonus = !currentDaily.bonusAwarded && Object.values(nextChecks).every(Boolean);
          setProfile((current) => {
            const currentDaily = current.daily.day === today
              ? current.daily
              : { day: today, checks: { vocabulary: false, speaking: false, conversation: false, score: false }, bonusAwarded: false };
            if (currentDaily.checks[task]) return current;
            const checks = { ...currentDaily.checks, [task]: true };
            const complete = Object.values(checks).every(Boolean);
            const bonus = complete && !currentDaily.bonusAwarded;
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const streak = bonus && current.lastPractice !== today
              ? current.lastPractice === localDayKey(yesterday) ? current.streak + 1 : 1
              : current.streak;
            return {
              ...current,
              xp: current.xp + (bonus ? 50 : 0),
              streak,
              lastPractice: bonus ? today : current.lastPractice,
              daily: { day: today, checks, bonusAwarded: currentDaily.bonusAwarded || bonus },
              history: bonus
                ? [...current.history, { day: today, xp: 50, action: "Daily challenge" }].slice(-40)
                : current.history,
            };
          });
          if (earnedBonus) showToast("Daily challenge complete · +50 bonus XP");
        }

        function rememberWord(word) {
          const key = `${language}:${word}`;
          setProfile((current) => {
            if (current.knownWords.includes(key)) return current;
            const knownWords = [...current.knownWords, key];
            return { ...current, knownWords, wordsLearned: knownWords.length };
          });
        }

        function updateMistake(item, gotItRight) {
          if (!item.word || !item.meaning) return;
          const normalizedWord = normalizeWords(item.word).join(" ");
          setProfile((current) => {
            const mistakes = Array.isArray(current.mistakes) ? current.mistakes : [];
            const index = mistakes.findIndex((mistake) =>
              mistake.language === language &&
              mistake.kind === item.kind &&
              normalizeWords(mistake.word).join(" ") === normalizedWord,
            );
            if (gotItRight) {
              if (index < 0) return current;
              const existing = mistakes[index];
              if ((existing.correctStreak || 0) + 1 >= 2) {
                return { ...current, mistakes: mistakes.filter((_, mistakeIndex) => mistakeIndex !== index) };
              }
              return {
                ...current,
                mistakes: mistakes.map((mistake, mistakeIndex) =>
                  mistakeIndex === index
                    ? { ...mistake, correctStreak: (mistake.correctStreak || 0) + 1 }
                    : mistake,
                ),
              };
            }

            if (index < 0) {
              return {
                ...current,
                mistakes: [
                  ...mistakes,
                  { ...item, language, missCount: 1, correctStreak: 0, lastSeen: today },
                ],
              };
            }
            return {
              ...current,
              mistakes: mistakes.map((mistake, mistakeIndex) =>
                mistakeIndex === index
                  ? { ...mistake, meaning: item.meaning, missCount: (mistake.missCount || 0) + 1, correctStreak: 0, lastSeen: today }
                  : mistake,
              ),
            };
          });
        }

        function changeTab(nextTab) {
          if (recognitionRef.current && nextTab !== "speak" && nextTab !== "conversation") {
            recognitionRef.current.stop();
          }
          setTab(nextTab);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function setLanguage(nextLanguage) {
          setProfile((current) => ({ ...current, language: nextLanguage }));
          setPhraseIndex(0);
          setSpeechFeedback(null);
          setTranscript("");
          setSpeechMessage("");
        }

        function playAudio(text, rate = 1) {
          if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
            setSpeechMessage("Audio playback isn't available in this browser. You can still read and practise the phrase.");
            return;
          }
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = languageInfo.locale;
          utterance.rate = rate;
          window.speechSynthesis.speak(utterance);
          setSpeechMessage("");
        }

        function recordSpeechResult(target, heard) {
          if (!heard.trim()) {
            setSpeechMessage("We couldn't hear any words that time. Try again or type what you said.");
            setSpeechState("idle");
            return;
          }
          const feedback = compareSpeech(target, heard);
          setSpeechFeedback({ ...feedback, target, heard });
          setSpeechState("idle");
          const phrase = phrases.find((item) => item.target === target);
          updateMistake(
            { word: target, meaning: phrase?.english || target, kind: "phrase" },
            feedback.score >= 80,
          );
          setProfile((current) => ({
            ...current,
            speakingExercises: current.speakingExercises + 1,
            pronunciationScores: [...current.pronunciationScores, feedback.score].slice(-30),
          }));
          awardXp(15 + Math.round(feedback.score / 10), "Speaking practice");
          markDaily("speaking");
          if (feedback.score >= 80) markDaily("score");
          if (feedback.missing.length) {
            setSpeechMessage(`Try once more, focusing on “${feedback.missing[0]}.”`);
          } else if (feedback.extra.length) {
            setSpeechMessage("Nice effort! Try saying just the displayed phrase, a little more slowly.");
          } else {
            setSpeechMessage("Lovely work—keep that confidence going!");
          }
        }

        function startListening(target) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            setSpeechMessage("Microphone speech recognition isn't available in this browser. You can still type your response below.");
            return;
          }
          if (speechState === "listening") {
            recognitionRef.current?.stop();
            return;
          }
          setTranscript("");
          setSpeechFeedback(null);
          setSpeechMessage("");
          try {
            const recognition = new SpeechRecognition();
            recognition.lang = languageInfo.locale;
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.onresult = (event) => {
              const heard = event.results[0][0].transcript;
              setSpeechState("analyzing");
              setTranscript(heard);
              window.setTimeout(() => recordSpeechResult(target, heard), 220);
            };
            recognition.onerror = (event) => {
              const messages = {
                "not-allowed": "Microphone access is blocked. Allow microphone access in your browser settings, or type your response instead.",
                "no-speech": "We didn't hear anything that time. Try again when you're ready.",
                "audio-capture": "A microphone isn't available right now. You can type your response instead.",
                network: "Speech recognition couldn't connect. Try again, or type your response.",
              };
              setSpeechMessage(messages[event.error] || "Sorry, we couldn't understand that. Please try again or type your response.");
              setSpeechState("idle");
            };
            recognition.onend = () => {
              setSpeechState((current) => current === "listening" ? "idle" : current);
            };
            recognitionRef.current = recognition;
            setSpeechState("listening");
            recognition.start();
          } catch {
            setSpeechState("idle");
            setSpeechMessage("The microphone couldn't start. Check your browser permissions or type your response.");
          }
        }

        function analyzeTypedSpeech(target) {
          recordSpeechResult(target, transcript);
        }

        function beginGame(mode) {
          const count = mode === "match" ? 4 : 5;
          const words = shuffle(vocabulary).slice(0, count);
          const question = mode === "translate" || mode === "order"
            ? phrases[Math.floor(Math.random() * phrases.length)]
            : null;
          const round = question
            ? [{ ...question, tokens: mode === "order" ? shuffle(question.target.split(/\s+/)) : [] }]
            : words.map((item) => ({
                ...item,
                choices: shuffle([
                  item.meaning,
                  ...shuffle(vocabulary.filter((other) => other.meaning !== item.meaning).map((other) => other.meaning)).slice(0, 3),
                ]),
              }));
          setMatchOptions(mode === "match" ? shuffle(words.map((item) => item.meaning)) : []);
          setGameMode(mode);
          setGameRound(round);
          setGameIndex(0);
          setGameScore(0);
          setGameAnswer("");
          setTypedAnswer("");
          setGameDone(false);
          setFlashRevealed(false);
          setSentenceParts([]);
          setGameNote("");
          setMatchedPairs([]);
          setMatchLeft("");
          setMatchRight("");
          setTab(mode === "flashcards" ? "vocabulary" : "learn");
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function beginMistakeReview() {
          const entries = profile.mistakes
            .filter((item) => item.language === language)
            .sort((left, right) => right.missCount - left.missCount)
            .slice(0, 5);
          const round = entries.map((entry) => {
            const isPhrase = entry.kind === "phrase";
            const choices = isPhrase
              ? phraseData[language].map((phrase) => phrase.english)
              : vocabulary.map((item) => item.meaning);
            return {
              ...(isPhrase ? { target: entry.word, english: entry.meaning } : { word: entry.word, meaning: entry.meaning }),
              memoryKind: entry.kind,
              choices: shuffle([entry.meaning, ...shuffle([...new Set(choices.filter((choice) => choice !== entry.meaning))]).slice(0, 3)]),
            };
          });
          setGameMode("mistakes");
          setGameRound(round);
          setGameIndex(0);
          setGameScore(0);
          setGameAnswer("");
          setTypedAnswer("");
          setGameDone(false);
          setFlashRevealed(false);
          setSentenceParts([]);
          setGameNote("");
          setMatchedPairs([]);
          setMatchLeft("");
          setMatchRight("");
          setMatchOptions([]);
          setTab("learn");
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function finishGame(finalScore) {
          setGameDone(true);
          setProfile((current) => ({ ...current, lessons: current.lessons + 1 }));
          awardXp(20 + finalScore * 6, "Activity complete");
          markDaily("vocabulary");
          if (finalScore / gameRound.length >= 0.8) markDaily("score");
        }

        function advanceGame(scored = gameScore) {
          if (gameIndex >= gameRound.length - 1) {
            finishGame(scored);
            return;
          }
          setGameIndex((index) => index + 1);
          setGameAnswer("");
          setTypedAnswer("");
          setFlashRevealed(false);
          setSentenceParts([]);
          setGameNote("");
        }

        function selectAnswer(answer) {
          if (gameAnswer) return;
          setGameAnswer(answer);
          const isPhrase = gameMode === "translate" || currentQuestion.memoryKind === "phrase";
          const expected = isPhrase ? currentQuestion.english : currentQuestion.meaning;
          const correct = gameMode === "translate"
            ? normalizeWords(answer).join(" ") === normalizeWords(expected).join(" ")
            : answer === expected;
          updateMistake({
            word: currentQuestion.word || currentQuestion.target,
            meaning: expected,
            kind: currentQuestion.memoryKind || (isPhrase ? "phrase" : "word"),
          }, correct);
          if (correct) {
            const nextScore = gameScore + 1;
            setGameScore(nextScore);
            if (currentQuestion.word && currentQuestion.memoryKind !== "phrase") rememberWord(currentQuestion.word);
            setGameNote("That's right! Lovely work.");
            awardXp(5, "Correct answer");
          } else {
            setGameNote(`Not quite—“${currentQuestion.word || currentQuestion.target}” means “${currentQuestion.meaning || currentQuestion.english}.”`);
          }
        }

        function submitTypedGame(event) {
          event.preventDefault();
          if (gameAnswer || !typedAnswer.trim()) return;
          const expected = gameMode === "fill"
            ? currentQuestion.word
            : gameMode === "order"
              ? currentQuestion.target
              : currentQuestion.english;
          const submitted = gameMode === "order" ? sentenceParts.join(" ") : typedAnswer;
          const correct = normalizeWords(submitted).join(" ") === normalizeWords(expected).join(" ");
          updateMistake({
            word: currentQuestion.word || currentQuestion.target,
            meaning: expected,
            kind: gameMode === "translate" || gameMode === "order" ? "phrase" : "word",
          }, correct);
          setGameAnswer(submitted);
          if (correct) {
            const nextScore = gameScore + 1;
            setGameScore(nextScore);
            if (currentQuestion.word) rememberWord(currentQuestion.word);
            setGameNote("You got it! Every word is a little win.");
            awardXp(5, "Correct answer");
          } else {
            setGameNote(`The answer is “${expected}.” Keep it in your growing word bank.`);
          }
        }

        function markFlashcard(known) {
          updateMistake(
            { word: currentQuestion.word, meaning: currentQuestion.meaning, kind: "word" },
            known,
          );
          if (known) {
            setGameScore((score) => score + 1);
            rememberWord(currentQuestion.word);
          }
          advanceGame(gameScore + (known ? 1 : 0));
        }

        function chooseMatch(side, value) {
          if (matchedPairs.includes(value)) return;
          const nextLeft = side === "left" ? value : matchLeft;
          const nextRight = side === "right" ? value : matchRight;
          if (side === "left") setMatchLeft(value);
          else setMatchRight(value);
          if (!nextLeft || !nextRight) return;
          if (nextLeft === nextRight) {
            const nextMatched = [...matchedPairs, nextLeft];
            setMatchedPairs(nextMatched);
            setMatchLeft("");
            setMatchRight("");
            const nextScore = gameScore + 1;
            setGameScore(nextScore);
            const word = gameRound.find((item) => item.meaning === nextLeft);
            if (word) rememberWord(word.word);
            awardXp(5, "Word match");
            if (nextMatched.length === gameRound.length) finishGame(nextScore);
          } else {
            const missedWord = gameRound.find((item) => item.meaning === nextLeft);
            if (missedWord) {
              updateMistake(
                { word: missedWord.word, meaning: missedWord.meaning, kind: "word" },
                false,
              );
            }
            setGameNote("Not a pair just yet—try another combination.");
            window.setTimeout(() => {
              setMatchLeft("");
              setMatchRight("");
            }, 650);
          }
        }

        function currentConversationTurns() {
          if (conversationScenario === "Introductions") return conversationData[language];
          const please = vocabulary.find((item) => item.meaning === "please");
          const thanks = vocabulary.find((item) => item.meaning === "thank you");
          const hello = vocabulary.find((item) => item.meaning === "hello");
          if (conversationScenario === "At a café") {
            return [
              { guide: "The server smiles and greets you.", english: "Say hello.", target: hello.word, translation: "Hello." },
              { guide: "The server asks what you'd like.", english: "Order a coffee, please.", target: phrases[2].target, translation: phrases[2].english },
              { guide: "Your coffee arrives.", english: "Say thank you.", target: thanks.word, translation: "Thank you." },
            ];
          }
          if (conversationScenario === "At the market") {
            const water = vocabulary.find((item) => item.meaning === "water");
            return [
              { guide: "The shopkeeper greets you.", english: "Say hello.", target: hello.word, translation: "Hello." },
              { guide: "You'd like some water.", english: "Ask for water, please.", target: `${water.word}, ${please.word}`, translation: "Water, please." },
              { guide: "The shopkeeper helps you.", english: "Say thank you.", target: thanks.word, translation: "Thank you." },
            ];
          }
          return [
            { guide: "Someone asks if you need help.", english: "Say hello.", target: hello.word, translation: "Hello." },
            { guide: "You are meeting someone new.", english: "Say “My name is Alex.”", target: phrases[1].target, translation: phrases[1].english },
            { guide: "Your new friend says goodbye.", english: "Say thank you.", target: thanks.word, translation: "Thank you." },
          ];
        }

        const conversationTurns = currentConversationTurns();
        const activeTurn = conversationTurns[conversationTurn];

        function startConversation() {
          setConversationTurn(0);
          setConversationAnswer("");
          setConversationMessages([]);
          setConversationFinished(false);
          setSpeechFeedback(null);
          setSpeechMessage("");
          setTranscript("");
          changeTab("conversation");
        }

        function sendConversationReply(event) {
          event.preventDefault();
          const reply = conversationAnswer.trim() || transcript.trim();
          if (!reply || !activeTurn) return;
          const feedback = compareSpeech(activeTurn.target, reply);
          updateMistake(
            { word: activeTurn.target, meaning: activeTurn.translation, kind: "phrase" },
            feedback.score >= 80,
          );
          const nextMessages = [
            ...conversationMessages,
            { from: "you", text: reply },
            { from: "guide", text: conversationTurn + 1 < conversationTurns.length
              ? conversationTurns[conversationTurn + 1].guide
              : "That was lovely chatting with you. ¡Hasta pronto!" },
          ];
          setConversationMessages(nextMessages);
          setConversationAnswer("");
          setTranscript("");
          setSpeechFeedback({ ...feedback, target: activeTurn.target, heard: reply });
          if (conversationTurn + 1 >= conversationTurns.length) {
            setConversationFinished(true);
            setProfile((current) => ({ ...current, conversations: current.conversations + 1 }));
            awardXp(45, "Conversation complete");
            markDaily("conversation");
            if (feedback.score >= 80) markDaily("score");
          } else {
            setConversationTurn((index) => index + 1);
          }
        }

        const currentBadgeNames = new Set(earnedBadges.map((badge) => badge.id));
        const tasks = [
          { id: "vocabulary", text: "Finish a vocabulary activity" },
          { id: "speaking", text: "Try one speaking exercise" },
          { id: "conversation", text: "Complete a short conversation" },
          { id: "score", text: "Get 80% or higher in an activity" },
        ];

            <header className="lq-welcome">
              <div>
                <p className="lq-kicker">{kicker}</p>
                <h1 className="lq-title">{title}</h1>
                {copy && <p className="lq-subtitle">{copy}</p>}
              </div>
              {action}
            </header>
          );
        }

            </div>

                  ["XP earned", profile.xp, "spark", "A little progress adds up"],
