            const water = vocabulary.find((item) => item.meaning === "water");
            return [
              { guide: "The shopkeeper greets you.", english: "Say hello.", target: hello.word, translation: "Hello." },
              { guide: "You'd like some water.", english: "Ask for water, please.", target: `${water.word}, ${please.word}`, translation: "Water, please." },
              { guide: "The shopkeeper helps you.", english: "Say thank you.", target: thanks.word, translation: "Thank you." },
            ];
          }
          return [
            { guide: "Someone asks if you need help.", english: "Say hello.", target: hello.word, translation: "Hello." },
            { guide: "You are meeting someone new.", english: "Say “My name is Alex.”", target: phrases[1].target, translation: phrases[1].english },
            { guide: "Your new friend says goodbye.", english: "Say thank you.", target: thanks.word, translation: "Thank you." },
          ];
        }

        const conversationTurns = currentConversationTurns();
        const activeTurn = conversationTurns[conversationTurn];

        function startConversation() {
          setConversationTurn(0);
          setConversationAnswer("");
          setConversationMessages([]);
          setConversationFinished(false);
          setSpeechFeedback(null);
          setSpeechMessage("");
          setTranscript("");
          changeTab("conversation");
        }

        function sendConversationReply(event) {
          event.preventDefault();
          const reply = conversationAnswer.trim() || transcript.trim();
          if (!reply || !activeTurn) return;
          const feedback = compareSpeech(activeTurn.target, reply);
          const nextMessages = [
            ...conversationMessages,
            { from: "you", text: reply },
            { from: "guide", text: conversationTurn + 1 < conversationTurns.length
              ? conversationTurns[conversationTurn + 1].guide
              : "That was lovely chatting with you. ¡Hasta pronto!" },
          ];
          setConversationMessages(nextMessages);
          setConversationAnswer("");
          setTranscript("");
          setSpeechFeedback({ ...feedback, target: activeTurn.target, heard: reply });
          if (conversationTurn + 1 >= conversationTurns.length) {
            setConversationFinished(true);
            setProfile((current) => ({ ...current, conversations: current.conversations + 1 }));
            awardXp(45, "Conversation complete");
            markDaily("conversation");
            if (feedback.score >= 80) markDaily("score");
          } else {
            setConversationTurn((index) => index + 1);
          }
        }

        const currentBadgeNames = new Set(earnedBadges.map((badge) => badge.id));
        const tasks = [
          { id: "vocabulary", text: "Finish a vocabulary activity" },
          { id: "speaking", text: "Try one speaking exercise" },
          { id: "conversation", text: "Complete a short conversation" },
          { id: "score", text: "Get 80% or higher in an activity" },
        ];

        function PageHeader({ kicker, title, copy, action }) {
          return (
            <header className="lq-welcome">
              <div>
                <p className="lq-kicker">{kicker}</p>
                <h1 className="lq-title">{title}</h1>
                {copy && <p className="lq-subtitle">{copy}</p>}
              </div>
              {action}
            </header>
          );
        }

        function renderHome() {
          const recommendations = profile.speakingExercises > 0 && averagePronunciation < 80
            ? "A few more short speaking rounds can help tricky words feel familiar."
            : "A quick speaking round is a lovely way to keep your new words moving.";
          return (
            <>
              <PageHeader
                kicker={`${languageInfo.flag} ${language} · ${profile.difficulty}`}
                title={`Hi, ${profile.name || "friend"}. Ready to explore?`}
                copy="No need to rush. A few minutes of practice is a lovely place to start."
                action={<button className="lq-primary" onClick={() => changeTab("learn")} type="button">Choose an activity <span aria-hidden="true">→</span></button>}
              />
              <div className="lq-stat-grid">
                {[
                  ["XP earned", profile.xp, "✦", "A little progress adds up"],
                  ["Practice streak", profile.streak, "🔥", profile.streak === 1 ? "day in a row" : "days in a row"],
                  ["Words picked up", profile.wordsLearned, "📚", "Ready when you are"],
                  ["Speaking practice", averagePronunciation ? `${averagePronunciation}%` : "—", "🎙️", "Approximate word match"],
                ].map(([label, value, icon, foot]) => (
                  <div className="lq-stat" key={label}>
                    <div className="lq-stat-top"><span>{label}</span><span className="lq-stat-icon">{icon}</span></div>
                    <strong className="lq-stat-value">{value}</strong>
                    <span className="lq-stat-foot">{foot}</span>
                  </div>
                ))}
              </div>
              <div className="lq-dashboard-grid">
                <section className="lq-level-card">
                  <span className="lq-level-mark" aria-hidden="true">🌿</span>
                  <div className="lq-card-heading">
                    <h2 className="lq-card-title">Your progress so far</h2>
                    <span className="lq-pill">Level {levelIndex + 1}</span>
                  </div>
                  <p className="lq-muted">{levelNames[levelIndex]} · You're making progress at your own pace.</p>
                  <div className="lq-progress-track" role="progressbar" aria-label="Progress to next level" aria-valuenow={levelProgress} aria-valuemin="0" aria-valuemax="100">
                    <div className="lq-progress-fill" style={{ width: `${levelProgress}%` }} />
                  </div>
                  <div className="lq-progress-meta"><span>{profile.xp} XP</span><span>{levelIndex === levelNames.length - 1 ? "Top level reached!" : `${Math.max(0, nextLevelXp - profile.xp)} XP to ${levelNames[levelIndex + 1]}`}</span></div>
                </section>
                <section className="lq-card">
                  <div className="lq-card-heading">
                    <h2 className="lq-card-title">A gentle goal for today</h2>
                    <span aria-hidden="true">☀️</span>
                  </div>
                  <p className="lq-muted">{dailyComplete ? "You did it! Your daily challenge is complete." : "No rush—each step counts. Complete all four for 50 bonus XP."}</p>
                  <div className="lq-challenge-list">
                    {tasks.slice(0, 3).map((task) => (
                      <div className="lq-check-row" key={task.id}>
                        <span className={`lq-check-icon${daily.checks[task.id] ? " done" : ""}`}>{daily.checks[task.id] ? "✓" : ""}</span>
                        {task.text}
                      </div>
                    ))}
                  </div>
                  <button className="lq-sidebar-link" style={{ marginTop: 13 }} onClick={() => changeTab("challenges")} type="button">See today's goals →</button>
                </section>
              </div>
              <div className="lq-section-heading"><h2>What sounds fun?</h2><button className="lq-sidebar-link" onClick={() => changeTab("learn")} type="button">Browse activities →</button></div>
              <div className="lq-activity-grid">
                {activityItems.slice(0, 6).map((item) => (
                  <button className="lq-activity" key={item.id} onClick={() => item.id === "speak" ? changeTab("speak") : item.id === "conversation" ? startConversation() : beginGame(item.id)} type="button">
                    <span className="lq-activity-icon" aria-hidden="true">{item.icon}</span>
                    <span className="lq-activity-title">{item.title}</span>
                    <span className="lq-activity-copy">{item.copy}</span>
                  </button>
                ))}
              </div>
              <div className="lq-section-heading"><h2>Little wins</h2><button className="lq-sidebar-link" onClick={() => changeTab("achievements")} type="button">See all achievements →</button></div>
              <section className="lq-card">
                <p className="lq-muted">{earnedBadges.length ? earnedBadges.slice(-3).map((badge) => `${badge.icon} ${badge.title}`).join("   ·   ") : recommendations}</p>
              </section>
            </>
          );
        }

        function renderLearn() {
          if (!gameRound.length) {
            return (
              <>
                <PageHeader kicker="Choose your next step" title="A little practice goes a long way." copy={`Pick any activity. We'll keep it at your ${profile.difficulty.toLowerCase()} level.`} />
                <div className="lq-two-col">
                  <section className="lq-practice-card">
                    <h2>Speaking comes first</h2>
                    <p>Listen to a phrase, say it into your microphone, then get an approximate word-match report. No pressure to be perfect.</p>
                    <button className="lq-primary" onClick={() => changeTab("speak")} type="button">Practice speaking 🎙️</button>
                  </section>
                  <section className="lq-card">
                    <h2 className="lq-card-title">Recommended for you</h2>
                    <p className="lq-muted">{profile.speakingExercises && averagePronunciation < 80 ? "Short, clear phrases can help you get comfortable with the sounds." : "Start with a quick word quiz, then try a conversation."}</p>
                    <button className="lq-sidebar-link" onClick={() => beginGame("quiz")} type="button">Try a quick quiz →</button>
                  </section>
                </div>
                <div className="lq-section-heading"><h2>Choose an activity</h2><span className="lq-muted">Small steps, steady progress</span></div>
                <div className="lq-activity-grid">
                  {activityItems.map((item) => (
                    <button className="lq-activity" key={item.id} onClick={() => item.id === "speak" ? changeTab("speak") : item.id === "conversation" ? startConversation() : beginGame(item.id)} type="button">
                      <span className="lq-activity-icon" aria-hidden="true">{item.icon}</span>
                      <span className="lq-activity-title">{item.title}</span>
                      <span className="lq-activity-copy">{item.copy}</span>
                    </button>
                  ))}
                </div>
                <div className="lq-section-heading"><h2>Language notes</h2></div>
                <section className="lq-card">
                  <p className="lq-muted">Beginner: pronunciation hints and simple words. Intermediate: longer phrases and fewer hints. Advanced: natural sentences and more independent practice. You can change your level in your profile.</p>
                </section>
              </>
            );
          }

          if (gameDone) {
            return (
              <>
                <PageHeader kicker="Practice complete" title="Look at you, showing up!" copy="Every round gives your new language a little more room to grow." />
                <section className="lq-card" style={{ maxWidth: 600 }}>
                  <div className="lq-stat-value">{gameScore} / {gameRound.length}</div>
                  <p className="lq-muted">You earned experience and moved today's learning goal forward. Mistakes are part of learning—you're doing great.</p>
                  <button className="lq-primary" onClick={() => beginGame(gameMode)} type="button">Try another round →</button>
                  <button className="lq-secondary" style={{ marginLeft: 8 }} onClick={() => { setGameRound([]); setGameDone(false); }} type="button">Back to activities</button>
                </section>
              </>
            );
          }

          if (gameMode === "match") {
            return (
              <>
                <PageHeader kicker="Word game · Match pairs" title="Find the matching meanings." copy={`${gameScore} of ${gameRound.length} pairs found. Pick one word from each column.`} action={<button className="lq-secondary" onClick={() => { setGameRound([]); }} type="button">Exit activity</button>} />
                <div className="lq-two-col">
                  <section className="lq-card"><h2 className="lq-card-title">In {language}</h2><div className="lq-challenge-list" style={{ marginTop: 14 }}>{gameRound.map((item) => <button className={`lq-game-card${matchedPairs.includes(item.meaning) ? " correct" : ""}`} style={{ minHeight: 48, justifyContent: "center", background: matchedPairs.includes(item.meaning) ? "#eef7ee" : matchLeft === item.meaning ? "#f2f6e9" : "" }} key={item.word} onClick={() => chooseMatch("left", item.meaning)} disabled={matchedPairs.includes(item.meaning)} type="button">{item.word}</button>)}</div></section>
                  <section className="lq-card"><h2 className="lq-card-title">In English</h2><div className="lq-challenge-list" style={{ marginTop: 14 }}>{matchOptions.map((meaning) => <button className="lq-game-card" style={{ minHeight: 48, justifyContent: "center", background: matchedPairs.includes(meaning) ? "#eef7ee" : matchRight === meaning ? "#f2f6e9" : "" }} key={meaning} onClick={() => chooseMatch("right", meaning)} disabled={matchedPairs.includes(meaning)} type="button">{meaning}</button>)}</div></section>
                </div>
                <p className="lq-muted" role="status">{gameNote || "Take your time. You can do this."}</p>
              </>
            );
          }

          if (gameMode === "flashcards") {
            return (
              <>
                <PageHeader kicker="Vocabulary · Flashcards" title="Let the words sink in." copy={`Card ${gameIndex + 1} of ${gameRound.length} · Take a guess before flipping.`} />
                <section className="lq-practice-card" style={{ maxWidth: 620, textAlign: "center" }}>
                  <p className="lq-kicker">{language} · {currentQuestion.hint}</p>
                  <h2 className="lq-target-text">{flashRevealed ? currentQuestion.meaning : currentQuestion.word}</h2>
                  {!flashRevealed ? <button className="lq-primary" style={{ marginTop: 19 }} onClick={() => { setFlashRevealed(true); playAudio(currentQuestion.word); }} type="button">Flip to see the meaning</button> : <div style={{ display: "flex", marginTop: 18, justifyContent: "center", gap: 9 }}><button className="lq-secondary" onClick={() => markFlashcard(false)} type="button">I'll review this one</button><button className="lq-primary" onClick={() => markFlashcard(true)} type="button">I knew it ✓</button></div>}
                  <p className="lq-muted" style={{ marginTop: 18 }}>A card you review is still a win—come back to it whenever you're ready.</p>
                </section>
              </>
            );
          }

          const isTextMode = ["fill", "order", "translate"].includes(gameMode);
          const orderTokens = currentQuestion.tokens || [];
          return (
            <>
              <PageHeader kicker={`Vocabulary · ${activityItems.find((item) => item.id === gameMode)?.title || "Practice"}`} title={gameMode === "fill" ? "Can you remember the word?" : gameMode === "order" ? "Put the sentence together." : gameMode === "translate" ? "What does this phrase mean?" : "Pick the meaning that fits."} copy={`Question ${gameIndex + 1} of ${gameRound.length} · ${gameScore} correct so far`} action={<button className="lq-secondary" onClick={() => { setGameRound([]); setGameDone(false); }} type="button">Exit activity</button>} />
              <section className="lq-speak-target" style={{ maxWidth: 720, margin: "0 auto" }}>
                {gameMode === "translate" ? <>
                  <p className="lq-target-label">Translate this into English</p>
                  <h2 className="lq-target-text">{currentQuestion.target}</h2>
                  <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(currentQuestion.target)} type="button">🔊 Listen</button></div>
                </> : gameMode === "order" ? <>
                  <p className="lq-target-label">Build this phrase in {language}</p>
                  <h2 className="lq-target-text">{currentQuestion.english}</h2>
                  <div className="lq-word-feedback">{orderTokens.map((token, index) => <button className="lq-word-chip" key={`${token}-${index}`} onClick={() => setSentenceParts((parts) => [...parts, token])} type="button">{token}</button>)}</div>
                  <p className="lq-target-translation">{sentenceParts.join(" ") || "Tap the words in order."}</p>
                </> : <>
                  <p className="lq-target-label">{gameMode === "fill" ? `How do you say “${currentQuestion.meaning}” in ${language}?` : gameMode === "listening" ? "Listen to the word, then choose its meaning." : "What does this word mean in English?"}</p>
                  <h2 className="lq-target-text">{currentQuestion.word}</h2>
                  {profile.difficulty === "Beginner" && <p className="lq-target-translation">Pronunciation hint: {currentQuestion.hint}</p>}
                  <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(currentQuestion.word, profile.difficulty === "Beginner" ? .78 : 1)} type="button">🔊 Listen</button></div>
                </>}
              </section>
              {gameMode === "match" ? null : isTextMode ? (
                <form className="lq-card" style={{ maxWidth: 720, margin: "14px auto 0" }} onSubmit={submitTypedGame}>
                  {gameMode !== "order" && <label className="lq-form-field"><span className="lq-form-label">{gameMode === "fill" ? "Your answer" : "Your translation"}</span><input className="lq-input" value={typedAnswer} onChange={(event) => setTypedAnswer(event.target.value)} disabled={Boolean(gameAnswer)} autoComplete="off" placeholder="Type your answer..." /></label>}
                  {gameMode === "order" && <button className="lq-secondary" style={{ marginRight: 8 }} onClick={() => setSentenceParts([])} type="button">Clear words</button>}
                  {!gameAnswer ? <button className="lq-primary" type="submit">Check my answer</button> : <button className="lq-primary" onClick={() => advanceGame(gameScore)} type="button">Next →</button>}
                  {gameNote && <p className="lq-muted" role="status">{gameNote}</p>}
                </form>
              ) : (
                <>
                  <p className="lq-muted" style={{ margin: "17px 0 9px" }}>Choose the meaning that feels right.</p>
                  <div className="lq-game-list">
                    {currentQuestion.choices.map((choice) => <button className="lq-game-card" style={{ minHeight: 55, borderColor: gameAnswer === choice ? (choice === currentQuestion.meaning ? "#85b58e" : "#e4a7a0") : undefined, background: gameAnswer === choice ? (choice === currentQuestion.meaning ? "#eef7ee" : "#fff1ee") : undefined }} key={choice} onClick={() => selectAnswer(choice)} disabled={Boolean(gameAnswer)} type="button">{choice}</button>)}
                  </div>
                  {gameNote && <p className="lq-muted" role="status">{gameNote}</p>}
                  {gameAnswer && <button className="lq-primary" style={{ marginTop: 13 }} onClick={() => advanceGame(gameScore)} type="button">Next →</button>}
                </>
              )}
            </>
          );
        }

        function renderSpeaking() {
          const tip = speechFeedback?.missing?.length
            ? `Try saying “${speechFeedback.missing[0]}” clearly, then give the full phrase another go.`
            : speechFeedback?.extra?.length
              ? "The transcript includes a few extra words. Try matching the phrase at a comfortable pace."
              : "Nice work. Listening and repeating is a great way to build confidence.";
          return (
            <>
              <PageHeader kicker={`${language} · ${profile.difficulty} speaking`} title="Say it out loud." copy="Listen first, then try saying the phrase. We'll show an approximate word-match from your browser's speech recognition." />
              {storageNotice && <div className="lq-notice" role="status">{storageNotice}</div>}
              <div className="lq-speak-layout">
                <section className="lq-speak-target">
                  <p className="lq-target-label">Try saying</p>
                  <h2 className="lq-target-text" lang={languageInfo.locale}>{currentPhrase.target}</h2>
                  {profile.difficulty === "Beginner" && <p className="lq-target-translation">{currentPhrase.english}</p>}
                  <div className="lq-audio-row">
                    <button className="lq-secondary" onClick={() => playAudio(currentPhrase.target, slowSpeech ? .72 : 1)} type="button">🔊 {slowSpeech ? "Slow replay" : "Listen first"}</button>
                    <button className="lq-secondary" onClick={() => setSlowSpeech((value) => !value)} type="button">{slowSpeech ? "Normal speed" : "Slow it down"}</button>
                    {window.speechSynthesis && <button className="lq-secondary" onClick={() => window.speechSynthesis.paused ? window.speechSynthesis.resume() : window.speechSynthesis.pause()} type="button">Pause / resume</button>}
                    <button className="lq-secondary" onClick={() => { setPhraseIndex((index) => (index + 1) % phrases.length); setSpeechFeedback(null); setTranscript(""); }} type="button">Another phrase ↻</button>
                  </div>
                </section>
                <section className="lq-mic-panel">
                  <button className={`lq-mic-button${speechState === "listening" ? " listening" : ""}`} onClick={() => startListening(currentPhrase.target)} type="button" aria-label={speechState === "listening" ? "Stop recording" : "Start speaking"}>🎙️</button>
                  <p className="lq-mic-title">{speechState === "listening" ? "Listening…" : speechState === "analyzing" ? "Checking the transcript…" : "Tap and say the phrase"}</p>
                  <p className="lq-mic-hint">{speechSupported ? "Your browser may ask for microphone permission. You can also type below." : "Microphone speech recognition isn't available. You can still practise by listening and typing."}</p>
                  <label className="lq-transcript-label" htmlFor="speak-transcript">What did you say?</label>
                  <textarea id="speak-transcript" className="lq-textarea" value={transcript} onChange={(event) => setTranscript(event.target.value)} placeholder="Your recognized words will appear here…" />
                  <button className="lq-primary" style={{ width: "100%", marginTop: 8 }} onClick={() => analyzeTypedSpeech(currentPhrase.target)} disabled={!transcript.trim() || speechState !== "idle"} type="button">Check my attempt</button>
                </section>
              </div>
              {speechMessage && <div className="lq-notice" style={{ marginTop: 14 }} role="status">{speechMessage}</div>}
              {speechFeedback && (
                <section className="lq-feedback-card" aria-live="polite">
                  <div className="lq-score-row">
                    <div className="lq-score-circle">{speechFeedback.score}%</div>
                    <div><strong style={{ color: "#3f6746" }}>{speechFeedback.score >= 90 ? "Lovely clarity!" : speechFeedback.score >= 70 ? "You're getting there!" : "Good first try!"}</strong><p className="lq-muted" style={{ margin: "4px 0 0" }}>Approximate speech-to-text match · not a scientific pronunciation score</p></div>
                  </div>
                  <p className="lq-muted"><strong>We heard:</strong> {speechFeedback.heard || "No clear words recognized."}</p>
                  <p className="lq-muted"><strong>Target:</strong> {speechFeedback.target}</p>
                  <div className="lq-word-feedback">{speechFeedback.matched.map((word, index) => <span className="lq-word-chip" key={`${word}-${index}`}>✓ {word}</span>)}{speechFeedback.missing.map((word, index) => <span className="lq-word-chip missed" key={`miss-${word}-${index}`}>Practice: {word}</span>)}{speechFeedback.extra.map((word, index) => <span className="lq-word-chip missed" key={`extra-${word}-${index}`}>Extra: {word}</span>)}</div>
                  <p className="lq-muted" style={{ marginBottom: 0 }}>{tip}</p>
                  {speechFeedback.missing.length > 0 && <button className="lq-secondary" style={{ marginTop: 12 }} onClick={() => { const word = speechFeedback.missing[0]; setTranscript(""); setSpeechFeedback(null); setSpeechMessage(`Practise this word, then try the phrase again: ${word}`); playAudio(word); }} type="button">Practise a tricky word</button>}
                </section>
              )}
              {!speechSupported && <p className="lq-muted" style={{ marginTop: 12 }}>Microphone access is unavailable in this browser. You can still listen and type your attempt to receive approximate word feedback.</p>}
            </>
          );
        }

        function renderConversation() {
          if (conversationFinished) {
            return (
              <>
                <PageHeader kicker="Conversation complete" title="You kept the conversation going!" copy="Speaking up takes courage. You did a lovely job practising." />
                <section className="lq-card" style={{ maxWidth: 680 }}>
                  <div className="lq-chat">{conversationMessages.map((message, index) => <div className={`lq-chat-bubble${message.from === "you" ? " user" : ""}`} key={`${index}-${message.text}`}><span className="lq-chat-speaker">{message.from === "you" ? profile.name : "Your conversation partner"}</span>{message.text}</div>)}</div>
                  <p className="lq-muted" style={{ marginTop: 17 }}>Speech feedback is approximate and based on browser speech-to-text, not a phoneme-level accent assessment.</p>
                  <button className="lq-primary" onClick={startConversation} type="button">Have another conversation</button>
                </section>
              </>
            );
          }
          return (
            <>
              <PageHeader kicker={`${language} · Guided conversation`} title="A friendly little chat." copy="Choose a scene, listen to your conversation partner, then reply with your voice or by typing." />
              <div className="lq-form-field" style={{ maxWidth: 300 }}>
                <label className="lq-form-label" htmlFor="conversation-scenario">Choose a scene</label>
                <select id="conversation-scenario" className="lq-select" value={conversationScenario} onChange={(event) => { setConversationScenario(event.target.value); setConversationTurn(0); setConversationMessages([]); setConversationAnswer(""); }}>
                  {["Introductions", "At a café", "At the market", "Meeting someone"].map((scene) => <option key={scene}>{scene}</option>)}
                </select>
              </div>
              <div className="lq-two-col">
                <section className="lq-card">
                  <h2 className="lq-card-title">Your conversation</h2>
                  <div className="lq-chat" style={{ marginTop: 15 }}>
                    <div className="lq-chat-bubble"><span className="lq-chat-speaker">Your conversation partner</span>{conversationScenario === "Introductions" ? activeTurn.guide : activeTurn.english}<span className="lq-chat-translation">{conversationScenario === "Introductions" ? activeTurn.english : activeTurn.guide}</span></div>
                    {conversationMessages.map((message, index) => <div className={`lq-chat-bubble${message.from === "you" ? " user" : ""}`} key={`${index}-${message.text}`}><span className="lq-chat-speaker">{message.from === "you" ? profile.name : "Your conversation partner"}</span>{message.text}</div>)}
                  </div>
                  <p className="lq-muted" style={{ marginTop: 15 }}>Turn {conversationTurn + 1} of {conversationTurns.length}</p>
                </section>
                <section className="lq-mic-panel">
                  <p className="lq-target-label">Your reply in {language}</p>
                  <h2 className="lq-target-text" lang={languageInfo.locale} style={{ fontSize: "1.55rem" }}>{activeTurn.target}</h2>
                  <p className="lq-target-translation">{activeTurn.translation}</p>
                  <div className="lq-audio-row"><button className="lq-secondary" onClick={() => playAudio(activeTurn.target)} type="button">🔊 Hear a reply</button></div>
                  <button className={`lq-mic-button${speechState === "listening" ? " listening" : ""}`} style={{ width: 64, height: 64, marginTop: 12, fontSize: "1.45rem" }} onClick={() => startListening(activeTurn.target)} type="button" aria-label="Speak your conversation reply">🎙️</button>
                  {speechMessage && <p className="lq-muted" role="status">{speechMessage}</p>}
                  <form style={{ width: "100%", marginTop: 4 }} onSubmit={sendConversationReply}>
                    <label className="lq-transcript-label" htmlFor="conversation-reply">Or type your reply</label>
                    <textarea id="conversation-reply" className="lq-textarea" value={conversationAnswer || transcript} onChange={(event) => { setConversationAnswer(event.target.value); setTranscript(""); }} placeholder="Write what you'd say…" />
                    <button className="lq-primary" style={{ width: "100%", marginTop: 8 }} disabled={!(conversationAnswer.trim() || transcript.trim())} type="submit">{conversationTurn + 1 === conversationTurns.length ? "Finish chat" : "Send reply →"}</button>
                  </form>
                </section>
              </div>
            </>
          );
        }

        function renderChallenges() {
          return (
            <>
              <PageHeader kicker="Your own pace, your own progress" title="Today's little goals." copy="Four gentle challenges. Finish them all for a 50 XP bonus—no worries if you save some for tomorrow." />
              <section className="lq-card" style={{ maxWidth: 720 }}>
                <div className="lq-card-heading"><h2 className="lq-card-title">{dailyComplete ? "All done for today!" : `${Object.values(daily.checks).filter(Boolean).length} of ${tasks.length} goals complete`}</h2><span className="lq-pill">+50 bonus XP</span></div>
                <div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${Object.values(daily.checks).filter(Boolean).length / tasks.length * 100}%` }} /></div>
                <div className="lq-challenge-list">{tasks.map((task) => <div className="lq-check-row" key={task.id}><span className={`lq-check-icon${daily.checks[task.id] ? " done" : ""}`}>{daily.checks[task.id] ? "✓" : ""}</span><span>{task.text}</span><span className="lq-muted" style={{ marginLeft: "auto" }}>{daily.checks[task.id] ? "Done" : "Whenever you're ready"}</span></div>)}</div>
                <p className="lq-muted" style={{ marginTop: 17 }}>Your streak grows when you practice. Missing a day just means you can start again—no guilt, just one word at a time.</p>
              </section>
            </>
          );
        }

        function renderProgress() {
          const weekScores = profile.pronunciationScores.slice(-7);
          return (
            <>
              <PageHeader kicker="Your progress" title="Look how far you've come." copy="A gentle record of your practice. Speech scores are approximate matches from browser recognition." />
              <div className="lq-stat-grid">
                {[
                  ["Words learned", profile.wordsLearned, "📚", "unique words"],
                  ["Activities", profile.lessons, "✦", "rounds completed"],
                  ["Speaking tries", profile.speakingExercises, "🎙️", "practice attempts"],
                  ["Practice time", `${profile.minutes}m`, "⏱️", "time in practice"],
                ].map(([label, value, icon, foot]) => <div className="lq-stat" key={label}><div className="lq-stat-top"><span>{label}</span><span>{icon}</span></div><strong className="lq-stat-value">{value}</strong><span className="lq-stat-foot">{foot}</span></div>)}
              </div>
              <div className="lq-two-col">
                <section className="lq-card">
                  <div className="lq-card-heading"><h2 className="lq-card-title">Recent speech-to-text matches</h2>{averagePronunciation > 0 && <span className="lq-pill">{averagePronunciation}% average</span>}</div>
                  {weekScores.length ? <div className="lq-chart" aria-label="Recent approximate speech matching scores">{weekScores.map((score, index) => <div className="lq-chart-column" key={`${index}-${score}`}><span className="lq-chart-value">{score}%</span><div className="lq-chart-bar" style={{ height: `${Math.max(4, score)}%` }} /><span className="lq-chart-label">Try {index + 1}</span></div>)}</div> : <p className="lq-muted">Your first speaking attempt will start this chart. These are approximate transcript matches, not scientific pronunciation measurements.</p>}
                </section>
                <section className="lq-card"><h2 className="lq-card-title">A few more ways to grow</h2><div className="lq-challenge-list" style={{ marginTop: 13 }}>{[["Vocabulary", Math.min(100, profile.wordsLearned * 4)], ["Lessons", Math.min(100, profile.lessons * 10)], ["Conversation", Math.min(100, profile.conversations * 20)]].map(([label, value]) => <div key={label}><div className="lq-progress-meta"><span>{label}</span><span>{value}%</span></div><div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${value}%` }} /></div></div>)}</div><p className="lq-muted">Current streak: 🔥 {profile.streak} {profile.streak === 1 ? "day" : "days"}</p></section>
              </div>
            </>
          );
        }

        function renderAchievements() {
          return (
            <>
              <PageHeader kicker="Little milestones" title="Every step deserves a badge." copy="Keep learning your way. These badges unlock naturally as you practise." />
              <section className="lq-card" style={{ marginBottom: 15 }}><strong>{earnedBadges.length} of {badgeCatalog.length} badges collected</strong><div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${earnedBadges.length / badgeCatalog.length * 100}%` }} /></div></section>
              <div className="lq-badge-grid">{badgeCatalog.map((badge) => <article className={`lq-badge${currentBadgeNames.has(badge.id) ? "" : " locked"}`} key={badge.id}><div className="lq-badge-icon" aria-hidden="true">{badge.icon}</div><div className="lq-badge-title">{badge.title}</div><p className="lq-badge-copy">{badge.text}</p><span className="lq-badge-copy">{currentBadgeNames.has(badge.id) ? "Collected ✓" : "Keep practising"}</span></article>)}</div>
            </>
          );
        }

        function renderVocabulary() {
          if (gameRound.length && gameMode === "flashcards") return renderLearn();
          return (
            <>
              <PageHeader kicker={`${language} word garden`} title="Words you've met so far." copy={`${profile.wordsLearned} unique ${profile.wordsLearned === 1 ? "word" : "words"} learned. Tap a speaker to hear any word, or try the flashcards.`} action={<button className="lq-primary" onClick={() => beginGame("flashcards")} type="button">Study flashcards →</button>} />
              <div className="lq-activity-grid">{vocabulary.map((item) => {
                const known = profile.knownWords.includes(`${language}:${item.word}`);
                return <article className="lq-card" key={item.word}><div className="lq-card-heading"><h2 className="lq-card-title">{item.meaning}</h2><span>{known ? "✓" : ""}</span></div><p className="lq-target-text" lang={languageInfo.locale} style={{ fontSize: "1.55rem" }}>{item.word}</p><p className="lq-muted">Say it like: {item.hint}</p><button className="lq-secondary" onClick={() => playAudio(item.word)} type="button">🔊 Listen</button></article>;
              })}</div>
            </>
          );
        }

        function renderProfile() {
          return (
            <>
              <PageHeader kicker="Your learning profile" title="Make this journey yours." copy="Change your preferences whenever you'd like. Your saved progress stays on this device." />
              {storageNotice && <div className="lq-notice" role="status">{storageNotice}</div>}
              <section className="lq-card">
                <div className="lq-preference-grid">
                  <label className="lq-form-field"><span className="lq-form-label">What should we call you?</span><input className="lq-input" value={profile.name} maxLength="24" onChange={(event) => setProfile((current) => ({ ...current, name: event.target.value }))} /></label>
                  <label className="lq-form-field"><span className="lq-form-label">Your first language</span><select className="lq-select" value={profile.nativeLanguage} onChange={(event) => setProfile((current) => ({ ...current, nativeLanguage: event.target.value }))}>{["English", ...languageNames.map((item) => item.name)].map((name) => <option key={name}>{name}</option>)}</select></label>
                  <label className="lq-form-field"><span className="lq-form-label">Language you're learning</span><select className="lq-select" value={language} onChange={(event) => setLanguage(event.target.value)}>{languageNames.map((item) => <option key={item.name} value={item.name}>{item.flag} {item.name}</option>)}</select></label>
                  <label className="lq-form-field"><span className="lq-form-label">Your comfort level</span><select className="lq-select" value={profile.difficulty} onChange={(event) => setProfile((current) => ({ ...current, difficulty: event.target.value }))}>{["Beginner", "Intermediate", "Advanced"].map((level) => <option key={level}>{level}</option>)}</select></label>
                </div>
                <div className="lq-level-card" style={{ marginTop: 7, maxWidth: 490 }}><span className="lq-level-mark" aria-hidden="true">🌿</span><h2 className="lq-card-title">Level {levelIndex + 1} · {levelNames[levelIndex]}</h2><div className="lq-progress-track"><div className="lq-progress-fill" style={{ width: `${levelProgress}%` }} /></div><div className="lq-progress-meta"><span>{profile.xp} XP</span><span>{nextLevelXp} XP next level</span></div></div>
                <div style={{ marginTop: 18 }}><button className="lq-sidebar-link" onClick={() => changeTab("achievements")} type="button">View your {earnedBadges.length} earned badges →</button></div>
              </section>
            </>
          );
        }

        function renderMore() {
          return (
            <>
              <PageHeader kicker="Your learning space" title="What would you like to explore?" copy="Your words, conversations, milestones, and personal settings are all here." />
              <div className="lq-activity-grid">
                {[
                  ["vocabulary", "📚", "My vocabulary", `${profile.wordsLearned} words learned`],
                  ["conversation", "💬", "Conversation room", "Practice a friendly chat"],
                  ["achievements", "🏅", "Achievements", `${earnedBadges.length} badges collected`],
                  ["profile", "👤", "My profile", "Language and level preferences"],
                ].map(([id, icon, title, copy]) => <button className="lq-activity" key={id} onClick={() => id === "conversation" ? startConversation() : changeTab(id)} type="button"><span className="lq-activity-icon">{icon}</span><span className="lq-activity-title">{title}</span><span className="lq-activity-copy">{copy}</span></button>)}
              </div>
            </>
          );
        }

        let content;
        if (tab === "home") content = renderHome();
        else if (tab === "learn") content = renderLearn();
        else if (tab === "speak") content = renderSpeaking();
        else if (tab === "conversation") content = renderConversation();
        else if (tab === "challenges") content = renderChallenges();
        else if (tab === "progress") content = renderProgress();
        else if (tab === "achievements") content = renderAchievements();
        else if (tab === "vocabulary") content = renderVocabulary();
        else if (tab === "profile") content = renderProfile();
        else content = renderMore();

        return (
          <div className="lq-app">
            <aside className="lq-sidebar">
              <div className="lq-brand"><span className="lq-brand-mark" aria-hidden="true">✿</span>LingoQuest</div>
              <p className="lq-nav-label">Your space</p>
              <nav className="lq-nav" aria-label="Main navigation">
                {navItems.map((item) => <button className={`lq-nav-button${tab === item.id ? " active" : ""}`} key={item.id} onClick={() => changeTab(item.id)} type="button"><span className="lq-nav-icon" aria-hidden="true">{item.icon}</span>{item.label}</button>)}
              </nav>
              <div className="lq-sidebar-spacer" />
              <section className="lq-sidebar-card"><h2 className="lq-sidebar-card-title">A small next step</h2><p className="lq-sidebar-card-copy">{profile.speakingExercises && averagePronunciation < 80 ? "Try a tricky phrase again, one word at a time." : "A little speaking practice can help today's words stick."}</p><button className="lq-sidebar-link" onClick={() => changeTab("speak")} type="button">Give it a try →</button></section>
              <button className="lq-user" onClick={() => changeTab("profile")} type="button" style={{ width: "100%", border: 0, background: "transparent", textAlign: "left", cursor: "pointer" }}><span className="lq-avatar" aria-hidden="true">😊</span><span><span className="lq-user-name">{profile.name || "Learner"}</span><br /><span className="lq-user-level">Level {levelIndex + 1} · {levelNames[levelIndex]}</span></span></button>
            </aside>
            <main className="lq-main">
              <div className="lq-topbar">
                <span className="lq-breadcrumb">Your space <span aria-hidden="true">/</span> {navItems.find((item) => item.id === tab)?.label || (tab === "conversation" ? "Conversation" : tab === "vocabulary" ? "Vocabulary" : tab === "achievements" ? "Achievements" : "Profile")}</span>
                <div className="lq-top-actions"><span className="lq-pill">{languageInfo.flag} {language}</span><span className="lq-pill">✦ {profile.xp} XP</span><span className="lq-pill">🔥 {profile.streak}</span></div>
              </div>
              <div className="lq-content">
                {storageNotice && tab !== "speak" && tab !== "profile" && <div className="lq-notice" role="status">{storageNotice}</div>}
                {content}
              </div>
            </main>
            {toast && <div className="lq-toast" role="status" aria-live="polite">{toast}</div>}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
