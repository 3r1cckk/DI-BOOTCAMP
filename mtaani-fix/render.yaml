services:
  - type: web
    name: mtaafix
    runtime: node
    plan: free
    rootDir: mtaani-fix
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "true"
